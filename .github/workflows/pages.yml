name: Site

# One composite site, published in a single deployment so no part can delete
# another:
#   /freeCAM/           the homepage: sends the visitor on to the documentation
#   /freeCAM/docs/      the documentation pages (web/site, copied as they are)
#   /freeCAM/builder/   the Workflow Builder preview
#   /freeCAM/progress/  the implementation-progress dashboard (a published
#                       snapshot of committed records -- never a live job
#                       monitor)
# all built from main.  Pushes to main and manual dispatch rebuild and publish
# the whole site; pull requests build previews from their own commit without
# publishing.  The development branch the dashboard once followed was merged
# into main and deleted (PR #13).  If any required build or export fails the
# deployment fails and the last successful public site stays up; development
# data is never silently substituted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  builder:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request against main previews its own builder and pages;
          # everything else builds them from main
          ref: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && github.sha || 'main' }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
      - name: Install the Python package and its test extras
        run: uv sync --extra test --extra ui
      - name: The catalog snapshot the page reads is current
        run: uv run python tools/export_workflow_catalog.py --check
      - name: Python tests of the builder's document, checks, bridge and service
        run: uv run pytest tests/unit/test_workflow_builder_document.py tests/unit/test_workflow_builder_catalog.py tests/unit/test_workflow_builder_validate.py tests/unit/test_workflow_builder_bridge.py tests/unit/test_workflow_builder_service.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the page's dependencies
        working-directory: web
        run: npm ci
      - name: Type-check and test the page (the export contract tests spawn the checkout's Python)
        working-directory: web
        run: npm run typecheck && npm test
      - name: Build the Workflow Builder for its subpath
        working-directory: web
        run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: site-builder
          path: web/dist-pages
      - name: Keep the homepage and documentation pages from the same commit
        uses: actions/upload-artifact@v4
        with:
          name: site-pages
          path: web/site

  progress:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a pull request previews its own dashboard; everything else builds it from main
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
      - name: Install the Python package and its test extras
        run: uv sync --extra test --extra ui
      - name: The catalog snapshot the exporter joins is current
        run: uv run python tools/export_workflow_catalog.py --check
      - name: The committed progress snapshot is current (content hash)
        run: uv run python tools/export_progress_snapshot.py --check
      - name: The work-item ledger is valid
        run: uv run python tools/kernel_work_items.py check
      - name: Exporter, counter, provenance and work-item tests
        run: uv run pytest tests/unit/test_progress_snapshot.py tests/unit/test_kernel_work_items.py tests/unit/test_runtime_coverage_record.py tests/unit/test_kernel_counts.py tests/unit/test_kcount_trampolines.py -q
      - name: Re-stamp the snapshot's volatile metadata with this build's commit
        # the content hash was just proven current; only generated_at, commit
        # and branch change, so the page displays the published build exactly
        run: uv run python tools/export_progress_snapshot.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the page's dependencies
        working-directory: web
        run: npm ci
      - name: Type-check and test the pages
        working-directory: web
        run: npm run typecheck && npm test
      - name: Build the progress dashboard for its subpath
        working-directory: web
        run: npm run build:progress
      - uses: actions/upload-artifact@v4
        with:
          name: site-progress
          path: web/dist-progress

  publish:
    needs: [builder, progress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: site-builder
          path: site/builder
      - uses: actions/download-artifact@v4
        with:
          name: site-progress
          path: site/progress
      - name: Record exactly which commits built this site
        run: |
          cat > site/site-manifest.json <<EOF
          {
            "builder_and_docs_commit": "${{ needs.builder.outputs.commit }}",
            "progress_commit": "${{ needs.progress.outputs.commit }}",
            "workflow_run": "${{ github.run_id }}",
            "trigger": "${{ github.event_name }} on ${{ github.ref_name }}"
          }
          EOF
      - name: Serve the assembled site and check direct navigation and assets
        run: |
          python3 -m http.server 8123 --directory site &
          sleep 2
          set -e
          for path in /index.html /docs/ /docs/index.html /docs/architecture.html /builder/ /builder/index.html /builder/catalog.json /progress/ /progress/index.html /progress/progress.json /site-manifest.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8123${path}")
            echo "${code} ${path}"
            test "${code}" = "200"
          done
          for page in builder progress; do
            asset=$(grep -o 'src="[^"]*assets/[^"]*"' "site/${page}/index.html" | head -1 | sed 's/src="\/freeCAM//; s/"//g')
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8123${asset}")
            echo "${code} ${asset}"
            test "${code}" = "200"
          done
          kill %1
      - name: Keep the preview build
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
      - name: Publish the composite site to the gh-pages branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Publish the site: docs and builder ${{ needs.builder.outputs.commit }}, progress ${{ needs.progress.outputs.commit }}"
