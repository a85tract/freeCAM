<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freeCAM globe</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6778; --line: #d8dde6;
  --accent: #2a62d6; --ocean: #d9e4f2; --land: #cdbf9f; --coast: #1c2330; --grid: rgba(28,35,48,.12);
  --sphere-edge: #9aa6b8; --mark: #e0247a; --zero: #bfc6d2;
  --anom-1: #d10fd1; --anom-2: #f07c00; --anom-3: #00a3b4;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --panel: #181e27; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2b3441;
    --accent: #7aa7ff; --ocean: #1b2a40; --land: #5c5442; --coast: #e6eaf1; --grid: rgba(230,234,241,.12);
    --sphere-edge: #44506a; --mark: #ff5fa8; --zero: #3a4454;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151c; --panel: #181e27; --ink: #e6eaf1; --muted: #9aa5b6; --line: #2b3441;
  --accent: #7aa7ff; --ocean: #1b2a40; --land: #5c5442; --coast: #e6eaf1; --grid: rgba(230,234,241,.12);
  --sphere-edge: #44506a; --mark: #ff5fa8; --zero: #3a4454;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 14px 16px 8px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; }
header h1 { font-size: 18px; margin: 0; font-weight: 650; }
header .run { color: var(--muted); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 0 16px 10px; }
.controls label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
select, button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; background: var(--panel); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; padding: 0 16px; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--muted); }
.globe-card { position: relative; }
#globe { width: 100%; aspect-ratio: 1 / 1; display: block; touch-action: none; cursor: grab; }
#globe.dragging { cursor: grabbing; }
#hover { position: absolute; left: 12px; top: 10px; font-size: 12px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 2px 6px; border-radius: 5px; }
#legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 6px; }
#legend canvas { flex: 1; height: 12px; min-width: 60px; border-radius: 3px; border: 1px solid var(--line); }
.side { display: grid; gap: 12px; align-content: start; }
#profile, #section { width: 100%; height: 260px; display: block; }
.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
footer { padding: 12px 16px 20px; display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.bar .label { font-size: 13px; color: var(--muted); grid-column: 1 / -1; min-height: 1.4em; }
input[type=range] { width: 100%; accent-color: var(--accent); }
#strip { width: 100%; height: 34px; display: block; border-radius: 5px; cursor: pointer; }
#proc-top a { color: var(--accent); cursor: pointer; text-decoration: none; margin-right: 12px; white-space: nowrap; }
#proc-top a:hover { text-decoration: underline; }
.hidden { display: none !important; }
#trace { display: grid; gap: 4px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
#trace .state { color: var(--muted); padding: 2px 6px; }
#trace button.step-row { all: unset; display: grid; gap: 1px; padding: 5px 6px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); }
#trace button.step-row:hover, #trace button.step-row:focus-visible { border-color: var(--accent); outline: none; }
#trace button.step-row[aria-current="true"] { border-color: var(--mark); box-shadow: inset 3px 0 0 var(--mark); }
#trace .name { font-weight: 600; }
#trace .who { color: var(--muted); }
#trace .up { color: #c0392b; } #trace .down { color: var(--accent); }
#trace .cur { font-weight: 600; }
.error { color: #c0392b; padding: 16px; }
#show-anomalies[aria-pressed="true"] { background: var(--anom-1); color: #fff; border-color: var(--anom-1); }
#show-anomalies .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--anom-1);
  margin-left: 6px; vertical-align: 1px; }
#anomaly-list { display: grid; gap: 5px; font-size: 12.5px; }
#anomaly-list button.item { all: unset; display: block; cursor: pointer; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 6px; border-left: 4px solid var(--anom-1); }
#anomaly-list button.item:hover, #anomaly-list button.item:focus-visible { border-color: var(--accent); outline: none; }
#anomaly-list .sub { color: var(--muted); display: block; margin-top: 2px; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
#anomaly-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
#trace .flag { font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>freeCAM globe</h1>
  <span class="run" id="run"></span>
</header>
<div class="controls">
  <label>Field <select id="field"></select></label>
  <label>Level <select id="level"></select></label>
  <span class="seg" role="group" aria-label="What to show">
    <button id="show-value" aria-pressed="true">Value</button>
    <button id="show-change" aria-pressed="false">Change</button>
  </span>
  <span class="seg" role="group" aria-label="Which bar">
    <button id="bar-steps" aria-pressed="true">Steps</button>
    <button id="bar-procs" aria-pressed="false">Processes in a step</button>
  </span>
  <label id="proc-step-label" class="hidden">Step <select id="proc-step"></select></label>
  <button id="show-anomalies" aria-pressed="false" title="Mark the columns where a recorded field is non-finite, negative water or constituent, or temperature out of range, and find the process that made them so">Anomalies</button>
  <button id="theme" title="Switch light and dark">◐</button>
</div>
<main>
  <section class="card globe-card">
    <canvas id="globe" aria-label="Globe of the chosen field"></canvas>
    <div id="hover"></div>
    <div id="legend"><span id="legend-lo"></span><canvas id="legend-bar" width="256" height="12"></canvas><span id="legend-hi"></span><span id="legend-units"></span></div>
    <div id="anomaly-legend" class="hidden"></div>
    <p class="note" id="globe-note">Drag to turn the globe; click a place for its column and the section along its meridian.</p>
  </section>
  <aside class="side">
    <section class="card" id="anomaly-card" hidden>
      <h2 id="anomaly-title">Anomalies</h2>
      <div id="anomaly-list"></div>
      <p class="note" id="anomaly-note"></p>
    </section>
    <section class="card">
      <h2 id="profile-title">Column</h2>
      <canvas id="profile"></canvas>
      <p class="note" id="profile-note">Click the globe to pick a column.</p>
    </section>
    <section class="card">
      <h2 id="section-title">Section along a meridian</h2>
      <canvas id="section"></canvas>
      <p class="note" id="section-note"></p>
    </section>
    <section class="card" id="trace-card" hidden>
      <h2 id="trace-title">This column through the step</h2>
      <div id="trace"></div>
      <p class="note" id="trace-note"></p>
    </section>
  </aside>
</main>
<footer>
  <div class="bar" id="step-bar">
    <button id="play" title="Play the steps once, from here to the last">▶</button>
    <input type="range" id="step-slider" min="0" max="0" value="0" aria-label="Step">
    <div class="label" id="step-label"></div>
  </div>
  <div class="bar hidden" id="proc-bar">
    <span></span>
    <div><canvas id="strip" aria-label="Processes of the step"></canvas>
      <input type="range" id="proc-slider" min="0" max="0" value="0" aria-label="Process"></div>
    <div class="label" id="proc-label"></div>
    <div class="label" id="proc-top"></div>
  </div>
</footer>
<script>
"use strict";
const EMBEDDED = /*STATE_DATA*/null;
const COAST = /*COASTLINE*/null;
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------------------------------------------------------------- data sources
// Served by `freecam globe DIR` the token is in the address; inside the Workflow Builder the
// page is same-origin with the builder and sends the builder's own token as a header.
const TOKEN = new URLSearchParams(location.search).get("token") || "";
function builderToken() { try { return sessionStorage.getItem("freecam-ui-token") || ""; } catch (error) { return ""; } }
async function api(path, query, binary) {
  const url = new URL(path.replace(/^\//, ""), location.href);      // relative: works at / and at /globe/
  for (const [k, v] of Object.entries(query || {})) url.searchParams.set(k, v);
  const headers = {};
  if (TOKEN) url.searchParams.set("token", TOKEN);
  else if (builderToken()) headers["X-FreeCAM-Token"] = builderToken();
  const response = await fetch(url, { headers, cache: "no-store" });
  if (!response.ok) throw new Error(await response.text());
  if (binary === "u8") return new Uint8Array(await response.arrayBuffer());
  return binary ? new Float32Array(await response.arrayBuffer()) : response.json();
}

class ServerSource {
  async init() { this.meta = await api("/api/meta"); }
  stepList() { return this.meta.step_frames; }
  actionSteps() { return Object.keys(this.meta.action_steps).map(Number).sort((a, b) => a - b); }
  actionNames(step) { return this.meta.action_steps[String(step)] || []; }
  levels(field) { return [...Array(this.fieldInfo(field).levels).keys()]; }
  fieldInfo(name) { return this.meta.fields.find((f) => f.name === name); }
  canStepChange() { return true; }
  where(frame) {
    return frame.kind === "steps" ? { kind: "steps", i: frame.p }
      : { kind: "actions", i: this.meta.action_frame_index[String(frame.step)][frame.k] };
  }
  level(frame, field, lev, mode) { return api("/api/level", { ...this.where(frame), field, lev, mode }, true); }
  async profile(frame, field, col) {
    const p = await api("/api/profile", { ...this.where(frame), field, col });
    return { ...p, pressure: this.meta.level_pressure_hpa, levels: this.levels(field) };
  }
  async section(frame, field, lon, mode) {
    const s = await api("/api/section", { ...this.where(frame), field, lon, mode });
    return { ...s, levels: this.levels(field) };
  }
  changes(step, field) { return api("/api/changes", { step, field }); }
  trace(step, col, lev) { return api("/api/trace", { step, col, lev }); }
  actionOwners(step) { return (this.meta.action_owners || {})[String(step)] || []; }
  // anomalies: the server looks at an action step's frames once, and counts each step frame once
  anomalies(step) { return api("/api/anomalies", { step }); }
  stepAnomalies() { return api("/api/anomalies", {}); }
  mask(frame, field) { return api("/api/anomaly_mask", { ...this.where(frame), field }, "u8"); }
  stepIndexOf(step) { return this.meta.step_frames.indexOf(step); }
  hasAnomalyData() { return true; }
}

async function inflate(b64, Type) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new Type(await new Response(stream).arrayBuffer());
}

class EmbeddedSource {
  constructor(payload) { this.meta = payload.meta; this.snap = payload.snapshot; this.cache = new Map(); }
  async init() {}
  stepList() { return this.snap.step_indices.map((i) => this.meta.step_frames[i]); }
  actionSteps() { return Object.keys(this.snap.action_steps).map(Number).sort((a, b) => a - b); }
  actionNames(step) { return this.snap.action_steps[String(step)].names; }
  levels(field) { return this.snap.fields[field].levels; }
  fieldInfo(name) { return this.meta.fields.find((f) => f.name === name); }
  // steps are carried 8-bit over a level's range: their differences would be quantization noise
  canStepChange() { return false; }
  async decoded(key, b64, Type) {
    if (!this.cache.has(key)) this.cache.set(key, inflate(b64, Type));
    return this.cache.get(key);
  }
  async stepBlock(field, lev) {
    const d = this.snap.fields[field].data[String(lev)];
    const codes = await this.decoded(`s|${field}|${lev}`, d.steps, Uint8Array);
    return { codes, lo: d.lo, hi: d.hi };
  }
  async stepValues(field, lev, p) {
    const { codes, lo, hi } = await this.stepBlock(field, lev);
    const n = this.meta.columns, out = new Float32Array(n), span = (hi - lo) / 255;
    for (let c = 0; c < n; c++) out[c] = lo + codes[p * n + c] * span;
    return out;
  }
  async actionValues(step, field, lev, k, mode) {
    const d = this.snap.action_steps[String(step)].fields[field].levels[String(lev)];
    const start = await this.decoded(`a0|${step}|${field}|${lev}`, d.start, Float32Array);
    const codes = await this.decoded(`a|${step}|${field}|${lev}`, d.changes, Int8Array);
    const n = this.meta.columns, out = new Float32Array(n);
    if (mode === "change") {
      const s = d.scales[k] / 127;
      for (let c = 0; c < n; c++) out[c] = codes[k * n + c] * s;
      return out;
    }
    out.set(start);
    for (let j = 1; j <= k; j++) {
      const s = d.scales[j] / 127;
      if (!s) continue;
      for (let c = 0; c < n; c++) out[c] += codes[j * n + c] * s;
    }
    return out;
  }
  async level(frame, field, lev, mode) {
    if (frame.kind === "actions") return this.actionValues(frame.step, field, lev, frame.k, mode);
    const now = await this.stepValues(field, lev, frame.p);
    if (mode !== "change") return now;
    if (frame.p === 0) return new Float32Array(now.length);
    const before = await this.stepValues(field, lev, frame.p - 1);
    for (let c = 0; c < now.length; c++) now[c] -= before[c];
    return now;
  }
  async profile(frame, field, col) {
    const levels = this.levels(field), values = [], before = [];
    for (const lev of levels) {
      values.push((await this.level(frame, field, lev, "value"))[col]);
      const prev = frame.kind === "actions" ? (frame.k > 0 ? { ...frame, k: frame.k - 1 } : null)
        : (frame.p > 0 ? { ...frame, p: frame.p - 1 } : null);
      before.push(prev ? (await this.level(prev, field, lev, "value"))[col] : NaN);
    }
    return { column: col, lat: this.meta.lat[col], lon: this.meta.lon[col], land: this.meta.land[col],
      values, before: before.every(Number.isNaN) ? null : before, pressure: this.meta.level_pressure_hpa, levels };
  }
  async section(frame, field, lon, mode) {
    const levels = this.levels(field), rows = [];
    const order = meridianColumns(lon);
    for (const lev of levels) {
      const v = await this.level(frame, field, lev, mode);
      rows.push(order.map((c) => v[c]));
    }
    return { lon, lat: order.map((c) => this.meta.lat[c]), values: rows, levels };
  }
  async changes(step, field) { return this.snap.action_steps[String(step)].fields[field].totals; }
  actionOwners(step) { return this.snap.action_steps[String(step)].owners || []; }
  hasAnomalyData() { return !!this.snap.anomalies; }
  async anomalies(step) { const a = this.snap.anomalies; return a && a.action_steps[String(step)] ? a.action_steps[String(step)].summary : null; }
  async stepAnomalies() { return this.snap.anomalies ? this.snap.anomalies.steps.summary : null; }
  // the page carries a subset of the step frames: the index of the first carried one at or after a step
  stepIndexOf(step) { const list = this.stepList(); const i = list.findIndex((s) => s >= step); return i < 0 ? list.length - 1 : i; }
  async anomalyCodes(frame, field) {
    const a = this.snap.anomalies;
    if (!a) return null;
    if (frame.kind === "actions") {
      const b = a.action_steps[String(frame.step)];
      return b && b.codes[field] ? { codes: await this.decoded(`an|${frame.step}|${field}`, b.codes[field], Uint8Array), row: frame.k } : null;
    }
    return a.steps.codes[field] ? { codes: await this.decoded(`as|${field}`, a.steps.codes[field], Uint8Array), row: frame.p } : null;
  }
  async mask(frame, field) {
    const got = await this.anomalyCodes(frame, field);
    if (!got) return null;
    const n = this.meta.columns;
    return got.codes.subarray(got.row * n, (got.row + 1) * n);
  }
  async trace(step, col, lev) {
    // the column at one level through the step, from the embedded start and each action's change
    const block = this.snap.action_steps[String(step)], names = block.names, m = this.meta;
    const fields = Object.keys(block.fields).filter((f) => block.fields[f].levels[String(lev)]);
    const rows = names.map((name, k) => ({ index: k, name, owner: (block.owners || [])[k] || null, values: {}, change: {}, error: {} }));
    for (const f of fields) {
      const d = block.fields[f].levels[String(lev)];
      const start = await this.decoded(`a0|${step}|${f}|${lev}`, d.start, Float32Array);
      const codes = await this.decoded(`a|${step}|${f}|${lev}`, d.changes, Int8Array);
      const n = m.columns;
      let value = start[col];
      rows.forEach((row, k) => {
        // each change is 8-bit over that action's largest change on the globe: within half a code of it
        if (k) { const dv = codes[k * n + col] * d.scales[k] / 127; row.change[f] = dv; row.error[f] = d.scales[k] / 254; value += dv; }
        row.values[f] = value;
      });
      const totals = block.fields[f].totals || [];
      rows.forEach((row, k) => { if (totals[k] && Number.isFinite(totals[k].seconds_mean)) row.seconds_mean = totals[k].seconds_mean; });
      const got = await this.anomalyCodes({ kind: "actions", step, k: 0 }, f);
      if (got) rows.forEach((row, k) => {
        const code = got.codes[k * n + col], before = k ? got.codes[(k - 1) * n + col] : 0;
        row.anomaly = row.anomaly || {}; row.became = row.became || {};
        if (code) { row.anomaly[f] = m.anomaly_kinds[code - 1]; if (!k || before !== code) row.became[f] = m.anomaly_kinds[code - 1]; }
        if (code === 1) { row.values[f] = null; row.change[f] = null; }
      });
    }
    return { step, column: col, lat: m.lat[col], lon: m.lon[col], land: m.land[col], level: lev,
      pressure_hpa: m.level_pressure_hpa[lev], fields: fields.map((f) => ({ name: f, units: this.fieldInfo(f).units })), rows,
      approximate: true };
  }
}

// every level and every step's changes kept once fetched (a slider revisits them)
function cached(source) {
  const levels = new Map(), changes = new Map(), LIMIT = 400;
  const level = source.level.bind(source), change = source.changes.bind(source);
  source.level = (frame, field, lev, mode) => {
    const key = JSON.stringify([frame, field, lev, mode]);
    if (!levels.has(key)) {
      const promise = level(frame, field, lev, mode);
      promise.catch(() => levels.delete(key));
      levels.set(key, promise);
      if (levels.size > LIMIT) levels.delete(levels.keys().next().value);
    }
    return levels.get(key);
  };
  source.changes = (step, field) => {
    const key = `${step}|${field}`;
    if (!changes.has(key)) { const promise = change(step, field); promise.catch(() => changes.delete(key)); changes.set(key, promise); }
    return changes.get(key);
  };
  return source;
}

// ---------------------------------------------------------------- colour maps
const STOPS = {
  thermal: [[0, [49, 54, 149]], [.2, [69, 117, 180]], [.4, [171, 217, 233]], [.55, [255, 255, 191]],
            [.75, [253, 174, 97]], [.9, [215, 48, 39]], [1, [165, 0, 38]]],
  moist: [[0, [255, 255, 217]], [.25, [199, 233, 180]], [.5, [65, 182, 196]], [.75, [34, 94, 168]], [1, [8, 29, 88]]],
  diverging: [[0, [33, 102, 172]], [.25, [103, 169, 207]], [.5, [247, 247, 247]], [.75, [239, 138, 98]], [1, [178, 24, 43]]],
  viridis: [[0, [68, 1, 84]], [.25, [59, 82, 139]], [.5, [33, 145, 140]], [.75, [94, 201, 98]], [1, [253, 231, 37]]],
};
function ramp(name) {
  const stops = STOPS[name], table = [];
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let j = 0;
    while (j < stops.length - 2 && t > stops[j + 1][0]) j++;
    const [t0, c0] = stops[j], [t1, c1] = stops[j + 1], f = (t - t0) / (t1 - t0 || 1);
    table.push(`rgb(${c0.map((v, k) => Math.round(v + (c1[k] - v) * f)).join(",")})`);
  }
  return table;
}
const RAMPS = Object.fromEntries(Object.keys(STOPS).map((k) => [k, ramp(k)]));
const RAMP_RGB = Object.fromEntries(Object.entries(RAMPS).map(([k, t]) => [k, t.map((c) => c.match(/\d+/g).map(Number))]));
const STYLE = { T: "thermal", Q: "moist", CLDLIQ: "cloud", CLDICE: "cloud", U: "signed", V: "signed", OMEGA: "signed", PS: "viridis" };
function styleOf(field, mode) {
  if (mode === "change") return "diverging";
  const s = STYLE[field] || "viridis";
  return s === "signed" ? "diverging" : s;
}

// ---------------------------------------------------------------- state
const S = {
  source: null, field: null, level: null, mode: "value", bar: "steps", p: 0, procStep: null, k: 0,
  lon0: 0, lat0: 20, values: null, range: null, fixedRange: new Map(), selected: null, changes: null,
  playing: false, token: 0,
  anomaly: false, mask: null, anom: null, stepAnom: null,
};
let geo = null;          // column geometry

function frame() {

  $("level").onchange = () => { S.level = Number($("level").value); update(); };
  $("show-value").onclick = () => { S.mode = "value"; setPressed("show-value", "show-change", true); update(); };
  $("show-change").onclick = () => { S.mode = "change"; setPressed("show-value", "show-change", false); update(); };
  S.syncChange = () => {
    const allowed = S.bar === "procs" || src.canStepChange();
    $("show-change").disabled = !allowed;
    $("show-change").title = allowed ? "" : "This page carries the steps 8-bit; their changes are shown by the server (freecam globe DIR)";
    if (!allowed && S.mode === "change") { S.mode = "value"; setPressed("show-value", "show-change", true); }
  };
  S.syncChange();
  const steps = src.stepList(), slider = $("step-slider");
  slider.max = Math.max(0, steps.length - 1); slider.value = 0;
  slider.oninput = () => { S.p = Number(slider.value); update(); };
  const actionSteps = src.actionSteps(), psel = $("proc-step");
  for (const s of actionSteps) { const o = document.createElement("option"); o.value = s; o.textContent = `${s}`; psel.appendChild(o); }
  S.procStep = actionSteps.length ? actionSteps[0] : null;
  $("bar-procs").disabled = !actionSteps.length;
  if (!actionSteps.length) $("bar-procs").title = "This run recorded no step after every process (--state-action-steps)";
  const showBar = (procs) => {
    S.bar = procs ? "procs" : "steps"; setPressed("bar-steps", "bar-procs", !procs);
    $("step-bar").classList.toggle("hidden", procs); $("proc-bar").classList.toggle("hidden", !procs);
    $("proc-step-label").classList.toggle("hidden", !procs);
    S.syncChange();
    if (procs) { const names = src.actionNames(S.procStep); $("proc-slider").max = Math.max(0, names.length - 1);
      S.k = Math.min(S.k, names.length - 1); $("proc-slider").value = S.k; loadChanges(); }
    S.anom = null; loadAnomalies();
    stop(); update();
  };
  $("bar-steps").onclick = () => showBar(false);
  $("bar-procs").onclick = () => showBar(true);
  psel.onchange = () => { S.procStep = Number(psel.value); S.k = 0; showBar(true); };
  $("proc-slider").oninput = () => { S.k = Number($("proc-slider").value); update(); };
  $("strip").onclick = (ev) => { S.k = stripIndex(ev); $("proc-slider").value = S.k; update(); };
  $("strip").onmousemove = (ev) => {
    const k = stripIndex(ev), row = S.changes ? S.changes[k] : null, name = src.actionNames(S.procStep)[k];
    ev.target.title = row && Number.isFinite(row.seconds_mean) && k > 0 ? `${name}: ${fmtMs(row.seconds_mean)}` : name;
  };
  $("play").onclick = () => (S.playing ? stop() : play());
  $("show-anomalies").onclick = () => {
    S.anomaly = !S.anomaly; $("show-anomalies").setAttribute("aria-pressed", String(S.anomaly));
    if (S.anomaly) loadAnomalies(); else { S.mask = null; drawAnomalies(); drawStrip(); }
    update();
  };
  $("theme").onclick = () => {
    const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark"
      : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark"; drawGlobe(); drawLegend(); drawProfile(); drawSection(); drawStrip();
  };
  // turning and picking
  let drag = null;
  canvas.addEventListener("pointerdown", (ev) => { drag = { x: ev.clientX, y: ev.clientY, lon0: S.lon0, lat0: S.lat0, moved: false };
    canvas.setPointerCapture(ev.pointerId); canvas.classList.add("dragging"); });
  canvas.addEventListener("pointermove", (ev) => {
    if (drag) {
      const r = canvas.getBoundingClientRect(), k = 180 / (Math.min(r.width, r.height) / 2) / Math.PI;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      S.lon0 = drag.lon0 - dx * k; S.lat0 = Math.max(-89, Math.min(89, drag.lat0 + dy * k));
      drawGlobe(); return;
    }
    const c = pick(ev);
    if (c == null || !S.values) { $("hover").textContent = ""; return; }
    const info = src.fieldInfo(S.field);
    const code = S.anomaly && S.mask ? S.mask[c] : 0;
    $("hover").textContent = `${fmtPlace(meta.lat[c], meta.lon[c])}: ${fmtValue(S.values[c], info.units, S.mode === "change")}` +
      (code ? ` — ${S.field} ${meta.anomaly_kinds[code - 1]} here` : "");
  });
  canvas.addEventListener("pointerup", (ev) => {
    canvas.classList.remove("dragging");
    const wasDrag = drag && drag.moved; drag = null;
    if (wasDrag) return;
    const c = pick(ev);
    if (c != null) { S.selected = c; drawGlobe(); drawProfile(); drawSection(); drawTrace(); }
  });
  addEventListener("resize", () => { drawGlobe(); drawLegend(); drawProfile(); drawSection(); drawStrip(); });
  runLabel();
}
let timer = null;
function play() {
  // once through the steps, from here to the last (from the first when already at the end)
  const slider = $("step-slider"), last = Number(slider.max);
  if (S.p >= last) { S.p = 0; slider.value = 0; update(); }
  S.playing = true; $("play").textContent = "❚❚";
  timer = setInterval(() => {
    if (S.p >= last) { stop(); return; }
    S.p += 1; slider.value = S.p; update();
    if (S.p >= last) stop();
  }, 350);
}
function stop() { S.playing = false; $("play").textContent = "▶"; if (timer) clearInterval(timer); timer = null; }

// ---------------------------------------------------------------- following a run still recording
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
function runLabel() {
  const meta = S.source.meta, steps = S.source.stepList(), actionSteps = S.source.actionSteps();
  $("run").textContent = `${meta.label || meta.run || meta.directory} · ${meta.columns} columns · ${steps.length} recorded steps` +
    (actionSteps.length ? ` · processes recorded at step ${actionSteps.join(", ")}` : "") +
    // a running model keeping its state in memory: the oldest steps are dropped as it goes on
    (meta.live ? " · live, from the model's memory" + ((meta.kept_from || {}).steps ? ` (the first ${meta.kept_from.steps} steps no longer kept)` : "")
      : (meta.complete ? "" : " · still recording"));
}
async function follow() {
  // every 2 s while the run records: more steps on the slider, and the newest shown when the
  // slider was on the newest (move it back to stop following)
  while (!EMBEDDED && !S.source.meta.complete) {
    await sleep(2000);
    let meta;
    try { meta = await api("api/meta"); } catch (error) { continue; }
    const slider = $("step-slider"), atNewest = S.p >= Number(slider.max);
    const grew = meta.step_frames.length !== S.source.meta.step_frames.length;
    S.source.meta = meta;
    slider.max = Math.max(0, meta.step_frames.length - 1);
    runLabel();
    if (grew && atNewest && S.bar === "steps" && !S.playing) { S.p = Number(slider.max); slider.value = S.p; await update(); }
    // the list of anomalies over the steps takes in the new steps (the server counts only those)
    if (grew && S.anomaly && S.bar === "steps") { S.stepAnom = null; loadAnomalies(); }
  }
}
function followTheme() {
  // inside the Workflow Builder: take the builder's light or dark, and drop this page's own switch
  if (window.parent === window) return;
  try {
    const outer = window.parent.document.documentElement;
    const apply = () => {
      if (outer.dataset.theme) document.documentElement.dataset.theme = outer.dataset.theme;
      if (S.source) { drawGlobe(); drawLegend(); drawProfile(); drawSection(); drawStrip(); }
    };
    $("theme").classList.add("hidden");
    new MutationObserver(apply).observe(outer, { attributes: true, attributeFilter: ["data-theme"] });
    apply();
  } catch (error) { /* another origin: keep this page's own switch */ }
}

(async function main() {
  followTheme();
  for (;;) {
    try {
      S.source = cached(EMBEDDED ? new EmbeddedSource(EMBEDDED) : new ServerSource());
      await S.source.init();
      break;
    } catch (error) {
      if (EMBEDDED) {
        document.body.insertAdjacentHTML("afterbegin", `<p class="error">Could not load the state: ${String(error.message || error)}</p>`);
        return;
      }
      // the run has not recorded its first step yet (or the server is not reachable): try again
      $("run").textContent = `Waiting for the first recorded step: ${String(error.message || error)}`;
      await sleep(2000);
    }
  }
  setupGeometry(); wire();
  // start over the place with the most columns in view: the meridian of the first column
  await update();
  if (!S.source.meta.complete) { const slider = $("step-slider"); S.p = Number(slider.max); slider.value = S.p; await update(); }
  follow();
})();
</script>
</body>
