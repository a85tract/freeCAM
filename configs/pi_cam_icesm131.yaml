schema_version: 1
case_name: f.e13.F1850C5.ne16_g16.icesm131_ihesp.PI-cam-oracle.50step
source_root: external/iCESM1.3.1_fzhu
resolution: ne16
mpi_size: 512
calendar: NO_LEAP
start_date: "0001-01-01"
start_seconds: 0
orbital_year: 1850
timestep_seconds: 1800
coupling_seconds: 1800
# The default online seed covers one NO_LEAP month (1,488 half-hour steps).
# The separate exact-online validation config retains the 50-step BFB gate.
stop_n: 1488
# After cam_init's initial export and the import/run1 priming pass, the source
# split timestep executes one complete look-ahead pass. It advances native
# state, but is not counted as a completed user step.
initialization_lookahead_steps: 1
pver: 30
pcols: 16
physics_package: cam5
dynamics: se

# The normal UI runs the original CESM surface components and coupler online.
# Offline replay remains available explicitly through case="PI-atm-replay".
boundary_mode: online
execution_mode: fine_grained

# Filled by tools/build_pi_cam_devices.py after the original numerical
# routines have been compiled with generated bind(C) adapters.
native_manifest: build/pi_cam_promoted/native_cam_manifest.json

# These are copied from the oracle case into an isolated run directory.
initial_conditions: null
namelist: null
