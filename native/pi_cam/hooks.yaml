# Hooks: kernels reached inside compiled routines without hoisting anything.
#
# For each hook the fixed image links a copy of every named caller object
# whose reference to the callee's symbol is renamed (objcopy --redefine-sym) to
# the hook's symbol; the copy's machine code is byte-identical to the oracle's
# and the build proves it.  The generated module pycam_hooks (from
# tools/generate_pi_cam_hooks.py) holds one hook procedure per kernel with the
# callee's own argument list, taken from the reviewed function contract: it
# counts every call, calls the original when the kernel is not armed, and when
# it is armed hands Python the frame by yielding the stage's fiber
# (native/pi_cam/pycam_fiber.c).  Fortran never calls Python.  A hook with a
# `model` block can instead be bound to a TorchScript model that the image runs
# itself through FTorch, with no Python in the step at all.
schema_version: 1
# the fiber stack every hooked stage runs on; reserved lazily
fiber_stack_bytes: 536870912
hooks:
  - kernel: cldfrc_fice
    contract: native/pi_cam/functions/cldfrc_fice.yaml
    original: {module: cloud_fraction, routine: cldfrc_fice}
    callee_symbol: cloud_fraction_mp_cldfrc_fice_
    # the callee lives in another object: the caller's references are renamed to the
    # hook's symbol (zm_conv_evap's call, zm_conv.F90:945, one R_X86_64_PC32 relocation)
    redirect: rename-references
    callers:
      - {object: zm_conv.o, routine: zm_conv_evap}
    # a model or a compiled plugin can answer it: temperature in, the two fractions out
    model:
      inputs: [t]
      outputs: [fice, fsnow]
  - kernel: fluxbelowinv
    contract: native/pi_cam/functions/fluxbelowinv.yaml
    # the callee is defined in the caller's own object, so its references cannot be
    # renamed apart from its definition: the definition is weakened and given a second
    # name, the hook takes the original name, and the linker resolves every reference
    # (compute_uwshcu's three call sites, six PC32 relocations) to the hook
    redirect: weaken-definition
    original: {symbol: uwshcu_mp_fluxbelowinv_original_}
    callee_symbol: uwshcu_mp_fluxbelowinv_
    callers:
      - {object: uwshcu.o, routine: compute_uwshcu}
  - kernel: instratus_condensate
    contract: native/pi_cam/functions/instratus_condensate.yaml
    # the saturation-adjustment core of mmacro_pcond, a private procedure of
    # cldwat2m_macro called twice per level inside it (the relaxation iteration
    # and the final state); defined in the caller's own object, so, as for
    # fluxbelowinv, the definition is weakened and the hook takes its name
    # (two PC32 relocations in cldwat2m_macro.o)
    redirect: weaken-definition
    original: {symbol: cldwat2m_macro_mp_instratus_condensate_original_}
    callee_symbol: cldwat2m_macro_mp_instratus_condensate_
    callers:
      - {object: cldwat2m_macro.o, routine: mmacro_pcond}
    # a TorchScript model the image runs itself at this hook (FTorch): the
    # model's forward takes these contract arguments as tensors, in this order
    # (a scalar integer such as k travels as a one-element real tensor), and
    # returns these outputs in this order; the hook writes the live columns back
    model:
      inputs: [k, p_in, t0_in, qv0_in, ql0_in, qi0_in, ni0_in, a_dc_in, ql_dc_in, qi_dc_in,
               a_sc_in, ql_sc_in, qi_sc_in, landfrac, snowh, rhmini_in, rhminl_in,
               rhminl_adj_land_in, rhminh_in]
      outputs: [t_out, qv_out, ql_out, qi_out, al_st_out, ai_st_out, ql_st_out, qi_st_out]
  - kernel: micro_mg_tend
    contract: native/pi_cam/functions/micro_mg_tend.yaml
    # the MG1 microphysics core, the most expensive kernel of the physics (10.6 ms a
    # call): a module routine of micro_mg1_0 called from micro_mg_cam_tend, so the
    # caller's references are renamed.  Its argument list has two logicals, a
    # character status and six pointer arrays, none of them interoperable, so the
    # hook is a plain Fortran procedure with the callee's own dummies: it answers
    # with the original or a bound model and has no frame to pause on (the
    # stage-7 runner's own pause at this kernel is unchanged: the runner's call is
    # not a renamed reference)
    binding: fortran
    redirect: rename-references
    original: {module: micro_mg1_0, routine: micro_mg_tend}
    callee_symbol: micro_mg1_0_mp_micro_mg_tend_
    callers:
      - {object: micro_mg_cam.o, routine: micro_mg_cam_tend}
    # a model takes every real input (the six inout arrays among them) as tensors of
    # the contract's shape, columns first, and returns the six inout arrays and every
    # real output; errstring is left blank
    model:
      inputs: [deltatin, tn, qn, qc, qi, nc, ni, p, pdel, cldn, liqcldf, relvar, accre_enhan, icecldf,
               naai, npccnin, rndst, nacon, reff_rain, reff_snow, tnd_qsnow, tnd_nsnow, re_ice,
               frzimm, frzcnt, frzdep]
      outputs: [qc, qi, nc, ni, rate1ord_cw2pr_st, tlat, qvlat, qctend, qitend, nctend, nitend, effc,
                effc_fn, effi, prect, preci, nevapr, evapsnow, am_evp_st, prain, prodsnow, cmeout,
                deffi, pgamrad, lamcrad, qsout, dsout, rflx, sflx, qrout, reff_rain, reff_snow,
                qcsevap, qisevap, qvres, cmeiout, vtrmc, vtrmi, qcsedten, qisedten, prao, prco,
                mnuccco, mnuccto, msacwio, psacwso, bergso, bergo, melto, homoo, qcreso, prcio, praio,
                qireso, mnuccro, pracso, meltsdt, frzrdt, mnuccdo, nrout, nsout, refl, arefl, areflz,
                frefl, csrfl, acsrfl, fcsrfl, rercld, ncai, ncal, qrout2, qsout2, nrout2, nsout2,
                drout2, dsout2, freqs, freqr, nfice, prer_evap, preo, prdso, frzro, meltso, wtfc, wtfi,
                wtprelat, wtpostlat]
  - kernel: compute_tms
    contract: native/pi_cam/functions/compute_tms.yaml
    # the turbulent mountain stress, a module routine of trb_mtn_stress called
    # from vertical_diffusion_tend; clubb_intr references it too but is not on
    # this configuration's path and keeps the original.  Plain arrays and
    # integers, sized by the routine's own pcols and pver dummies: Fortran-bound
    # so the extents follow those dummies, with a model block a plugin can take
    binding: fortran
    redirect: rename-references
    original: {module: trb_mtn_stress, routine: compute_tms}
    callee_symbol: trb_mtn_stress_mp_compute_tms_
    callers:
      - {object: vertical_diffusion.o, routine: vertical_diffusion_tend}
    model:
      inputs: [ncol, u, v, t, pmid, exner, zm, sgh, landfrac]
      outputs: [ksrf, taux, tauy]
  - kernel: compute_uwshcu_inv
    contract: native/pi_cam/functions/uwshcu.yaml
    # the UW shallow cumulus scheme, the most expensive single kernel of the physics (6.5 ms a call): a module routine of uwshcu called from convect_shallow_tend
    binding: fortran
    redirect: rename-references
    original: {module: uwshcu, routine: compute_uwshcu_inv}
    callee_symbol: uwshcu_mp_compute_uwshcu_inv_
    callers:
      - {object: convect_shallow.o, routine: convect_shallow_tend}
    model:
      inputs: [dt, ps0_inv, zs0_inv, p0_inv, z0_inv, dp0_inv, u0_inv, v0_inv, qv0_inv, ql0_inv, qi0_inv, t0_inv, s0_inv, tr0_inv, tke_inv, cldfrct_inv, concldfrct_inv, pblh, cush, dpdry0_inv]
      outputs: [cush, umf_inv, slflx_inv, qtflx_inv, flxprc1_inv, flxsnow1_inv, qvten_inv, qlten_inv, qiten_inv, sten_inv, uten_inv, vten_inv, qrten_inv, qsten_inv, precip, snow, evapc_inv, cufrc_inv, qcu_inv, qlu_inv, qiu_inv, cbmf, qc_inv, rliq, cnt_inv, cnb_inv, trten_inv, wtqc_inv, wtprec, wtsnow]
      # one (columns, width) tensor back: the FTorch floor is the output tensors' allocation, so 30 tensors
      # become one.  The tracer arrays come last, so a model may derive the water-tracer tendencies from
      # tr0_inv and its own water tendencies (the scheme carries the isotopes itself) and zero the rest
      packed: true
  - kernel: mmacro_pcond
    contract: native/pi_cam/functions/mmacro_pcond.yaml
    # the macrophysics condensation core, called from macrop_driver_tend; instratus_condensate inside it keeps its own hook.  A logical and six pointer dummies: Fortran-bound
    binding: fortran
    redirect: rename-references
    original: {module: cldwat2m_macro, routine: mmacro_pcond}
    callee_symbol: cldwat2m_macro_mp_mmacro_pcond_
    callers:
      - {object: macrop_driver.o, routine: macrop_driver_tend}
    model:
      inputs: [dt, p, dp, t0, qv0, ql0, qi0, nl0, ni0, a_t, a_qv, a_ql, a_qi, a_nl, a_ni, c_t, c_qv, c_ql, c_qi, c_nl, c_ni, c_qlst, d_t, d_qv, d_ql, d_qi, d_nl, d_ni, a_cud, a_cu0, clrw_old, clri_old, landfrac, snowh]
      outputs: [t0, qv0, ql0, qi0, nl0, ni0, s_tendout, qv_tendout, ql_tendout, qi_tendout, nl_tendout, ni_tendout, qme, qvadj, qladj, qiadj, qllim, qilim, cld, al_st_star, ai_st_star, ql_st_star, qi_st_star]
  - kernel: zm_conv_evap
    contract: native/pi_cam/functions/zm_conv_evap.yaml
    # the evaporation of convective precipitation, called by both the deep scheme's driver and the shallow one's
    binding: fortran
    redirect: rename-references
    original: {module: zm_conv, routine: zm_conv_evap}
    callee_symbol: zm_conv_mp_zm_conv_evap_
    callers:
      - {object: zm_conv_intr.o, routine: zm_conv_tend}
      - {object: convect_shallow.o, routine: convect_shallow_tend}
    model:
      inputs: [ncol, lchnk, t, pmid, pdel, q, landfrac, tend_s, tend_q, prdprec, cldfrc, deltat, prec]
      outputs: [tend_s, tend_s_snwprd, tend_s_snwevmlt, tend_q, prec, snow, evpstore, substore, ntprprd, ntsnprd, flxprec, flxsnow]
  - kernel: momtran
    contract: native/pi_cam/functions/momtran.yaml
    # convective momentum transport, called from zm_conv_tend with the two wind components as its tracers
    binding: fortran
    redirect: rename-references
    original: {module: zm_conv, routine: momtran}
    callee_symbol: zm_conv_mp_momtran_
    callers:
      - {object: zm_conv_intr.o, routine: zm_conv_tend}
    model:
      inputs: [lchnk, ncol, q, mu, md, du, eu, ed, dp, dsubcld, il1g, il2g, nstep, dt]
      outputs: [dqdt, pguall, pgdall, icwu, icwd, seten]
  - kernel: zm_convr
    contract: native/pi_cam/functions/zm_convr.yaml
    # the Zhang-McFarlane deep convection core, called from zm_conv_tend; three pointer dummies, a logical array and six dummies without an intent: Fortran-bound
    binding: fortran
    redirect: rename-references
    original: {module: zm_conv, routine: zm_convr}
    callee_symbol: zm_conv_mp_zm_convr_
    callers:
      - {object: zm_conv_intr.o, routine: zm_conv_tend}
    model:
      inputs: [lchnk, ncol, t, qh, pblh, zm, geos, zi, pap, paph, dpp, delt, tpert, lengath, ql, landfrac]
      outputs: [prec, jctop, jcbot, qtnd, heat, mcon, cme, cape, dlf, pflx, zdu, rprd, mu, md, du, eu, ed, dp, dsubcld, ql, rliq, qu, qd, dz, rppe, eps0, cu, evp, tu, td, qs, qsthat, hmn, hsat, hsthat, wteu, wted, wtdu, wtmu, wtmd, wtcu, c0mask, wtrpd, qds, wtevp]
  - kernel: compute_eddy_diff
    contract: native/pi_cam/functions/compute_eddy_diff.yaml
    # the UW moist turbulence scheme's eddy diffusivities, called from vertical_diffusion_tend
    binding: fortran
    redirect: rename-references
    original: {module: eddy_diff, routine: compute_eddy_diff}
    callee_symbol: eddy_diff_mp_compute_eddy_diff_
    callers:
      - {object: vertical_diffusion.o, routine: vertical_diffusion_tend}
    model:
      inputs: [lchnk, ncol, t, qv, ztodt, ql, qi, s, pdel, rpdel, cldn, qrl, wsedl, z, zi, pmid, pi, u, v, taux, tauy, shflx, qflx, nturb, kvm_in, kvh_in, tauresx, tauresy, ksrftms]
      outputs: [rrho, ustar, pblh, kvm_out, kvh_out, kvq, cgh, cgs, tpert, qpert, wpert, tke, bprod, sprod, sfi, tauresx, tauresy, wstarpbl, tkes, went, sm_aw]
