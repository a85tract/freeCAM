      - cam_history_mp_outfld_
      - dycore_mp_get_resolution_
      - dyn_grid_mp_dyn_grid_get_pref_
      - mpibcast_
      - phys_control_mp_phys_getopts_
      - phys_grid_mp_get_rlat_all_p_
      - phys_grid_mp_get_rlon_all_p_
      - physics_buffer_mp_get_pbuf1d_field_by_index_2d_double_
