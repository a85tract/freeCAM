# Standalone function specification for cldfrc_fice, the ice fraction of the
# total cloud water as a function of temperature: the kernel-API closure's
# representative kernel inside a hoisted kernel.  In the model it is called by
# zm_conv_evap, itself a kernel of the deep-convection stage, where the zmdeep
# runner enters the hoisted evaporation driver to pause at it; here it is the
# same routine on one column packed into lane 0.
#
# This file is the runtime's only source of truth for the function boundary.
# tools/verify_pi_cam_function_spec.py checks it against the kernel inventory
# and the pinned source; the runtime never parses Fortran.

schema_version: 1
function: cldfrc_fice
qualified_name: cloud_fraction::cldfrc_fice
routine: cldfrc_fice
source: components/cam/src/physics/cam/cloud_fraction.F90
module: cloud_fraction
binding: module
layout: column

dimensions:
  pcols: 16
  pver: 30
public_axes:
  pver: lev

arguments:
  - name: ncol
    role: structural
    fortran_type: integer
    dtype: int32
    rank: 0
    intent: in
    native_shape: []
    value: 1
    description: Number of active columns; the public API always evaluates one.
  - name: t
    role: input
    fortran_type: real
    dtype: float64
    rank: 2
    intent: in
    native_shape: [pcols, pver]
    public_shape: [pver]
    units: K
    range: [150.0, 350.0]
    constraints: [positive]
    description: Temperature.
  - name: fice
    role: output
    fortran_type: real
    dtype: float64
    rank: 2
    intent: out
    native_shape: [pcols, pver]
    public_shape: [pver]
    units: fraction
    description: Fractional ice content within cloud.
  - name: fsnow
    role: output
    fortran_type: real
    dtype: float64
    rank: 2
    intent: out
    native_shape: [pcols, pver]
    public_shape: [pver]
    units: fraction
    description: Fractional snow content for convection.

parameters: {}

# tmelt is physconst's protected freezing point; the image links physconst's
# object with its initial value and verifies it against the model's.
module_state:
  - {symbol: physconst_mp_tmelt_, dtype: float64, shape: [], write: verify}

image:
  archive_members:
    - cloud_fraction.o
    - physconst.o
    - ref_pres.o
    - cam_logfile.o
    - ppgrid.o
  stubs:
