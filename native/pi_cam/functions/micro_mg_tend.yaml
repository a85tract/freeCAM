# The standalone boundary of MG1.0's microphysics core.
#
# micro_mg_tend takes 116 plain arrays -- the packed cloudy columns the
# CAM driver gathers -- and returns the tendencies and the process rates.
# It is the swappable kernel of the Python microphysics stage: this file
# is what lets the same routine run outside the model, on one column, so
# a replacement can be compared with it.
#
# Reviewed by hand from tools/draft_pi_cam_function_spec.py's draft.  The
# source declares no bracketed units, so units stay unset rather than
# invented, and ranges with them: a sampling space needs a captured anchor
# first, and Gate M-5 compares the routine with itself.  `ndust` is the
# routine's own literal 4, the dust bins contact freezing carries.
schema_version: 1
function: micro_mg_tend
qualified_name: micro_mg1_0::micro_mg_tend
routine: micro_mg_tend
source: components/cam/src/physics/cam/micro_mg1_0.F90
module: micro_mg1_0
dimensions:
  pcols: 16
  pver: 30
  pverp: 31
  ndust: 4
public_axes:
  pver: lev
  pverp: ilev
  ndust: dust_bin
# the routine writes its own extents; these are the same axes under CAM's names
