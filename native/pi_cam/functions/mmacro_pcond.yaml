# Standalone function specification for mmacro_pcond, CAM5 cloud
# macrophysics (Park et al.), treated as a pure single-column function.
#
# This file is the runtime's only source of truth for the function boundary.
# tools/verify_pi_cam_function_spec.py checks it at build time against the
# kernel inventory (argument order, dtype, rank, intent, extents) and against
# the declaration comments in the pinned source (units); the runtime never
# parses Fortran.
#
# Why this routine and not the stage: macrop_driver_tend is physics-buffer
# plumbing around it.  cldwat2m_macro.F90 references no physics buffer, loops
# `do i = 1, ncol` over independent columns, keeps no saved state between
# calls, and takes its entire input set through these 60 arguments plus the
# module state listed below -- so a call is a closed function of what is
# declared here.

schema_version: 1
function: mmacro_pcond
qualified_name: cldwat2m_macro::mmacro_pcond
routine: mmacro_pcond
source: components/cam/src/physics/cam/cldwat2m_macro.F90
module: cldwat2m_macro

dimensions:
  pcols: 16
  pver: 30
  pverp: 31
public_axes:
  pver: lev
  pverp: ilev

# Fortran argument order.  Roles:
#   structural  owned by the runtime, never user-visible
#   input       intent(in), user-supplied (defaults where the MVP holds a
#               forcing term at zero -- the well-defined case of no advection,
#               no microphysical feedback, no detrainment, no PBL flux)
#   inout       user supplies the initial value, updated on return
#   output      allocated by the runtime, returned
#   workspace   passed but never dereferenced: the six real(r8), pointer
#               dummies are read only when i_rhminl/i_rhmini are non-zero,
#               and both are 0 in the admitted configuration (UW shallow);
#               the module_state block pins that guard.
