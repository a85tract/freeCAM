# Called once after load, before module state is verified.  wv_sat_init
# needs no namelist, grid, or MPI; it sets the saturation constants the
# routine's qsat/findsp calls depend on.
initializers:
  - wv_saturation_mp_wv_sat_init_

# How the standalone image is linked: oracle archive members (numerics are
# never recompiled) plus the stubs that close the link.  cloud_fraction.o is
# deliberately absent -- it is reachable only through ini_macro's
# cldfrc_getparams and would drag cam_history, phys_grid and PIO/MPI in.
image:
  archive_members:
    - cldwat2m_macro.o
    - cldfrc2m.o
    - wv_saturation.o
    - wv_sat_methods.o
    - constituents.o
    - physconst.o
    - ppgrid.o
    - cam_logfile.o
    - ref_pres.o
    - error_messages.o
  stubs:
    inert:
      - cam_history_mp_outfld_
      - cam_history_mp_hist_fld_active_
      - shr_assert_mod_mp_shr_assert_in_domain_0d_double_
      - spmd_utils_mp_masterproc_
      - mpishorthand_mp_mpicom_
      - mpishorthand_mp_mpir8_
      - mpishorthand_mp_mpichar_
    fail_closed:
      - cam_history_mp_addfld_
      - cloud_fraction_mp_cldfrc_getparams_
      - mpibcast_
      - shr_nl_mod_mp_shr_nl_find_group_name_
      - units_mp_getunit_
      - units_mp_freeunit_
      - dyn_grid_mp_dyn_grid_get_pref_
      - netcdf_mp_nf90_strerror_
    abort:
      - shr_sys_mod_mp_shr_sys_abort_
  base_address: 0x50000000
