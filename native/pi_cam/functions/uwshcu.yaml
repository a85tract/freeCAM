# Standalone function specification for compute_uwshcu_inv, the UW shallow
# cumulus scheme (Park and Bretherton 2009), treated as a pure single-column
# function.
#
# This file is the runtime's only source of truth for the function boundary.
# tools/verify_pi_cam_function_spec.py checks it at build time against the
# kernel inventory (argument order, dtype, rank, intent, extents) and against
# the declaration comments in the pinned source (units); the runtime never
# parses Fortran.
#
# Why this routine and not the stage: convect_shallow_tend is physics-buffer
# plumbing around it -- it copies the physics state, pulls a dozen pbuf
# fields, and packs the result into a ptend.  compute_uwshcu_inv inverts the
# vertical index order and calls compute_uwshcu, whose entire calculation runs
# inside `do i = 1, iend` (uwshcu.F90:1389); the only work outside that loop
# is a level loop over findsp_vc, which is element-wise per column.  So a call
# is a closed function of these 54 arguments plus the module state below.
#
# Water isotope tracing is active in this configuration (atm_in sets
# trace_water and wisotope true), so the water_tracers path is live and its
# objects are linked rather than stubbed.

schema_version: 1
function: uwshcu
qualified_name: uwshcu::compute_uwshcu_inv
routine: compute_uwshcu_inv
source: components/cam/src/physics/cam/uwshcu.F90
module: uwshcu

dimensions:
  pcols: 16
  pver: 30
  pverp: 31
  pcnst: 57
public_axes:
  pver: lev
  pverp: ilev

# The routine names its own extents; these are the canonical dimensions they
# denote, so the build-time verifier can compare the spec against the kernel
# inventory without inferring anything.
dimension_aliases:
  mix: pcols
  mkx: pver
  mkx + 1: pverp
  ncnst: pcnst

# Fortran argument order.  Roles:
#   structural  owned by the runtime, never user-visible
#   input       intent(in), user-supplied
#   inout       user supplies the initial value, updated on return
#   output      allocated by the runtime, returned
