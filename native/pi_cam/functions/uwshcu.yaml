  - wv_saturation_mp_wv_sat_init_

# How the standalone image is linked.  Two archives: the atmosphere library
# for the physics, and CSM share for shr_spfn_erfc -- which uwshcu calls on
# its numerical path (uwshcu.F90:2362, 2382, 6066) and so must be linked, not
# stubbed -- and for the isotope tables water_tracers reads.  cloud_fraction,
# physics_buffer and cam_initfiles are deliberately absent: they are reachable
# only from water_tracers routines this entry point does not call, and each
# would drag cam_history and PIO/MPI in.
image:
  archive_members:
    - uwshcu.o
    - constituents.o
    - water_tracers.o
    - water_tracer_vars.o
    - wv_saturation.o
    - wv_sat_methods.o
    - physconst.o
    - ppgrid.o
    - cam_logfile.o
    - error_messages.o
    - {member: shr_spfn_mod.o, archive: csm_share}
    - {member: water_isotopes.o, archive: csm_share}
    - {member: water_types.o, archive: csm_share}
  stubs:
    inert:
      - cam_history_mp_outfld_
      - shr_assert_mod_mp_shr_assert_in_domain_0d_double_
      - spmd_utils_mp_masterproc_
      - mpishorthand_mp_mpicom_
      - mpishorthand_mp_mpir8_
      - mpishorthand_mp_mpichar_
      - mpishorthand_mp_mpiint_
      - mpishorthand_mp_mpilog_
    fail_closed:
      - cam_history_mp_addfld_
      - cam_history_mp_add_default_
      - cam_initfiles_mp_initial_file_get_id_
      - cloud_fraction_mp_cldfrc_fice_
      - physics_buffer_mp_pbuf_add_field_double_
      - physics_buffer_mp_pbuf_get_field_name_
      - physics_buffer_mp_get_pbuf1d_field_by_index_1d_double_
      - mpibcast_
      - shr_nl_mod_mp_shr_nl_find_group_name_
      - units_mp_getunit_
      - units_mp_freeunit_
      - netcdf_mp_nf90_strerror_
    abort:
      - shr_sys_mod_mp_shr_sys_abort_
  base_address: 0x50000000
