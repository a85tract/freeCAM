# The scheme's one namelist tunable.  Every other module value it reads is a
# physical constant recorded in module_state.
parameters:
  uwshcu_rpen:
    dtype: float64
    symbols: [uwshcu_mp_rpen_]
    default: 5.0
    range: [1.0, 20.0]
    description: Penetrative entrainment efficiency.

# init_uwshcu registers 40 history fields through addfld, which the image
# stubs fail-closed, so it cannot run here: the constants it would set are
# taken from the snapshot instead.  wv_sat_init needs no namelist, grid or
# MPI and is called, as for mmacro_pcond.
module_state:
  # uwshcu's own constants, all set by init_uwshcu from physconst.
  - {symbol: uwshcu_mp_xlv_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_xlf_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_xls_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_cp_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_zvir_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_r_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_g_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_ep2_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_p00_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_rovcp_, dtype: float64, shape: [], write: snapshot}
  - {symbol: uwshcu_mp_rpen_, dtype: float64, shape: [], write: parameter}

  # cnst_get_ind and cnst_get_type_byind scan these tables and endrun if a
  # name is absent; qmin bounds the tracer update.
  - symbol: constituents_mp_cnst_name_
    dtype: S16
    shape: [57]
    write: snapshot
    expected: [Q, CLDLIQ, CLDICE, NUMLIQ, NUMICE]
  - {symbol: constituents_mp_cnst_type_, dtype: S8, shape: [57], write: snapshot}
  - {symbol: constituents_mp_qmin_, dtype: float64, shape: [57], write: snapshot}

  # Water isotope tracing.  Every runtime-set value in water_tracer_vars is
  # taken from the model rather than reasoned about one at a time: the six
  # water_tracers entry points uwshcu calls read wisotope, wtrc_alpha_kinetic,
  # wtrc_fixed_alpha, wtrc_fixed_rstd and wtrc_qmin, and uwshcu itself reads
  # iwspec, trace_water, wtrc_iatype and wtrc_nwset.
  - {symbol: water_tracer_vars_mp_trace_water_, dtype: int32, shape: [], write: snapshot, expected: 1}
  - {symbol: water_tracer_vars_mp_wisotope_, dtype: int32, shape: [], write: snapshot, expected: 1}
  - {symbol: water_tracer_vars_mp_wtrc_ncnst_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_wtrc_nwset_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_wtrc_nspec_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_wtrc_ntype_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_iwspec_, dtype: int32, shape: [4], write: snapshot}
  - {symbol: water_tracer_vars_mp_iwater_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_iwistag_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_wtrc_alpha_kinetic_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_wtrc_lh2oadj_, dtype: int32, shape: [], write: snapshot}
  - {symbol: water_tracer_vars_mp_wtrc_fixed_alpha_, dtype: float64, shape: [4], write: verify}
