# Standalone function specification for instratus_condensate, the saturation
# adjustment and stratus-fraction closure at the core of mmacro_pcond
# (cldwat2m_macro.F90): given one level's grid-mean state and the cumulus
# condensate, it returns the adjusted state and the liquid/ice stratus
# fractions and in-stratus condensate.  A private procedure of cldwat2m_macro,
# called twice per level inside mmacro_pcond (the relaxation iteration and the
# final state); here it is reached through its ifort symbol behind an explicit
# interface, on the routine's own layout: one level, pcols columns per array.
#
# This file is the runtime's only source of truth for the function boundary.
# tools/verify_pi_cam_function_spec.py checks it against the kernel inventory
# and the pinned source; the runtime never parses Fortran.

