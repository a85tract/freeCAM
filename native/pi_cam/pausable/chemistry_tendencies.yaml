# around chem_timestep_tend (control patch 0028) and that driver hoisted
# whole, pausable at the gas-phase driver gas_phase_chemdr, which is the
# kernel entire: one pause, a wide frame.  The driver's early return on a
# skipped chemistry step is carried out by the runner.
