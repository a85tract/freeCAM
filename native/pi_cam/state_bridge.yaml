    type: cam_in_t
    source: components/cam/src/control/camsrfexch.F90
  - name: cam_out
    type: cam_out_t
    source: components/cam/src/control/camsrfexch.F90
  - name: phys_state
    type: physics_state
    source: components/cam/src/physics/cam/physics_types.F90
  - name: phys_tend
    type: physics_tend
    source: components/cam/src/physics/cam/physics_types.F90

exclude: []
