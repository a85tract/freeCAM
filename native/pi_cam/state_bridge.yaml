schema_version: 1

# The generator reads these original derived-type declarations and exposes
# every numeric component through one stable pointer-table state ABI.  Python
# is authoritative between native calls; the old derived types remain a
# temporary mirror until every numerical kernel consumes StatePool arrays
# directly.
owners:
