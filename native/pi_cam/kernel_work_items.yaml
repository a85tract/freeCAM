  note: 'Hook gate 7371011 and capture gate 7371232 both bit-for-bit (9000 pauses per rank); every frame
    captured (512 ranks, 47 GB); the first capture (7371012) died out of memory, kept as a failure record.
    The few-free-variables surrogate ran fifty steps from Python (7371974: 6731 water-tracer BIG ERROR
    lines, zero QNEG3) and 983 steps of the month (7373795: SIGSEGV at day 20.5; cause in the source:
    the driver''s linearisation takes the routine''s output as the saturated state). The same model exported
    as TorchScript and bound at the hook (FTorch, inside the image) answered all 4,608,000 calls of a
    fifty-step run with no Python in the step (7392240, exclusive nodes: 0.41 ms a call against 2.8 ms
    from Python; 6719 BIG ERROR lines); the p13 image with nothing replaced is bit-for-bit (7391564).
    First attempts: 7371767 (a set in the model pickled per rank) and 7391565 (a node without libfabric),
    both failure records. In shadow (the model runs, the original answers) the same TorchScript costs
    0.35 ms a call on p17 (7399452) and 0.34 ms on p18 (7400409), both bit-for-bit. Direction paused
    by the maintainer on 2026-09-10.'
