- kernel: micro_mg1_0::micro_mg_tend
  target_processes:
  - cam_run1.cloud_macro_microphysics
  owner_class: freecam.physics.microphysics.Microphysics
  state: in_progress
  stage: capture_replay
  owner: claude
  branch: physics-kernel-api-closure
  started_at: '2026-09-09'
  updated_at: '2026-09-11'
  next_gate: none for speed -- the core costs 1.4 ms a call (2.8 ms a step, 1.8 percent of the step loop)
    and every network of a useful size costs more inside the image; a surrogate here is a science question,
    not a performance one
  note: 'First capture attempt (7358831) aborted on manifest/image version skew: the p10 image exports
    no pycam_stage7_original_v1 (validation/pi_cam_pausable_micro-capture_50step_failure.json); the p11
    capture (7359460) is bit-for-bit and holds all 51,200 calls. Hooked on 2026-09-10 as a Fortran-bound
    hook (the callee''s own kinds, packed (mgncol, nlev) arrays sized by its pcols/pver dummies, bindable
    to a model, not pausable); the first build sized the arrays by the contract and corrupted memory (7394255,
    failure record). Images p14/p15/p18/p19 with nothing bound are bit-for-bit (7393462, 7394422, 7400407,
    7401310); a null model bound at the hook answered all 51,200 calls inside the image (7394423, 7399102).
    Shadow runs put the mechanism at 0.56 ms a call on p18 (7400408) once the stage stopped re-reading
    hooks.yaml every step and the bind took the warm-up out of the step loop. On 2026-09-11 four per-column
    MLP surrogates (64 to 512 wide, 0.9 to 7.6 MB of weights; qctend R2 0.73 to 0.89, tlat 0.52 to 0.72
    on 64 held-out ranks) were trained on the p11 capture and exported as TorchScript. In shadow on p19,
    which times the original on the same calls (7401282, 7401281, 7401311, 7400992 on p18; all bit-for-bit):
    the core costs 1.33 to 1.40 ms a call, the networks 1.47, 2.25, 3.71 and 6.71 ms -- their weights
    streamed from memory by 128 ranks at once (one-node bench 7401108: the 7.6 MB network 1.47 ms alone,
    6.38 ms with 128 processes). Live (7400993, 7401059, 7401232; not bit-for-bit, 300,000 lines of water-tracer
    and QNEG3 messages) the step loop is 9.02, 8.67 and 8.55 s against 7.64 s with nothing bound. The
    same networks'' forward written as a Numba plugin (no libtorch; examples/plugins/numba_kernels/micro_mlp.py),
    in shadow on p20 with the core timed (7404600, 7404599, 7404601; bit-for-bit): 0.87, 1.45 and 2.92
    ms a call against the core''s 1.43 to 1.47 -- the 64-wide network cheaper than the core, the 128-wide
    at parity, 0.6 to 0.8 ms below the FTorch path at every width. Not a speed target on these nodes:
    the core is 1.8 percent of the step.'
