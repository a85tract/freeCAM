  note: 'The whole radiative branch of radiation_tend (optics, both RRTMG cores, their diagnostics) is
    one process slot. In the Python transcription: capture (7417373, BFB), replay (7417486, state exact;
    26 history diagnostics absent), trained emulators live (7417501, 7417608, 7417764, 7417763). Inside
    the image (p21): a skeleton slot in the pausable runner asks pycam_rad_process_answer; the runner
    with the slot unbound is BFB (7418303), the month-trained 256-wide emulator compiled with Numba and
    bound at the slot runs in shadow BFB at 1.4 ms a call (7418443) and live answers all 25,600 calls
    (7418444): rad_tend 0.23 s a rank per 50 steps against 1.40, the step loop 14.7 s against 16.1, the
    state the same as the Python path''s. Two plugin runs OOM at 4 x 64 GB (7418223/7418224, failure records)
    and two ran with the slot never bound because prepare_segmented was defined twice (7418304/7418305,
    fixed, not evidence).'
