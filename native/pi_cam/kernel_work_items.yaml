  next_gate: 'a network good enough to use: the zenith angle given back to the block model, more captured
    data, the longwave near the surface, the clear-sky and TOA diagnostics; then a paired year'
  note: 'Month pair on main (replayed boundary): Radiation installed and nothing bound 401.3 s over 1,488
    steps, bit-for-bit (7418517); the 256-wide emulator at the slot 363.9 s, nine percent shorter (7418518),
    the radiation budget drifting 4 to 5 W/m2 over the month. Four ways to answer the radiation now, all
    gated: a compiled Python kernel at the slot, called by Fortran (0.23 s a rank per 50 steps, 7418444);
    a TorchScript model through FTorch (64-wide transformer 0.72 s, 7431803); Python at the runner''s
    pause (the same MLP 0.82 s, 7434965; the original branch through the pause bit-for-bit, 7434783);
    and the Python driver with a model of the whole compute block (p24: the day-1 capture replayed through
    it bit-for-bit in state, 7436003; the block emulator 0.38 s a rank once compiled, 7436082, drifting
    1.5 K/day because it must learn the zenith angle). The 64-wide transformer priced on the other two paths
    (p24): written out in Numba as a plugin 12.5 ms a call, rad_tend 0.84 s a rank (shadow 7439472 bit-for-bit,
    live 7439535, 0.17 K rms); its block contract through the Python driver 15.5 ms a call, half of it the
    view-to-tensor conversion, rad_tend 1.20 s (7439603, 1.27 K rms); FTorch at the slot stays the cheapest at
    7.1 ms. A month on each path (p24, 7452662-7452667): the MLP plugin 366.2 s against 400.2 with nothing bound, the
    MLP through the Python driver 371.9 s (6 s of it the first call''s compile); the transformer 385.4 s as a plugin,
    374.3 s through the driver; the block models (no zenith angle given) are physically unusable over the month
    (-46 and -243 W/m2 of net shortwave), the slot models drift 4-5 W/m2 as before. The mechanism is closed in
    every form; the network is the open problem. The cloud macro/microphysics stage (mmacro_pcond''s) has the same
    Python-driver form since 2026-09-14 (p26): two block contracts (cloud_block.MACRO_BLOCK, MICRO_BLOCK), captured
    (7453135) and replayed bit-for-bit in state (7453150; the halves 7452498, 7453151), the driver 0.37 s a rank per
    50 steps over native-whole; no model of either block yet, and no history entry (the drivers'' 141 outfld
    diagnostics are not reproduced by a replay).'
