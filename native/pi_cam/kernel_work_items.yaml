    its pcols/pver dummies, bindable to a model, not pausable); the first build sized the arrays by the
    contract and corrupted memory (7394255, failure record). Images p14/p15 with nothing bound are
    bit-for-bit (7393462, 7394422); a null model bound at the hook answered all 51,200 calls inside the
    image (7394423, 7399102). Shadow runs (the model runs, the original answers, bit-for-bit) put the
    mechanism at 1.63 ms a call on p17 (7399451) and 0.56 ms on p18 (7400408), after the stage stopped
    re-reading hooks.yaml every step and the bind took the warm-up forward out of the step loop; the
    placeholder MLP of the network''s real size costs another 1.4 ms a call (7394424, timing only). No
    trained model exists yet.'
