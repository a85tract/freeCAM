# Reviewed classification of candidate kernels: what kind of routine each one
# is, which class owns its replacement, and the source basis for the call.
#
# Categories:
#   replaceable_numeric  changes scientific values; belongs in the replaceable
#                        completion denominator once observed executing
#   data_movement        pack/unpack, pointer plumbing, field registration
#   state_service        storage lookup, allocation, initialization of storage
#   diagnostic           bookkeeping and output staging; no prognostic change
#   control              drivers and dispatch the stage classes already own
#   inactive             stubs of schemes disabled in this configuration
#
# A candidate absent from this file is unclassified; an unclassified observed
# routine blocks its process from being marked complete.  The completion
# denominator (runtime-observed AND replaceable_numeric) is computed by the
# exporter, never written by hand.  Subsystem names the plan's grouping inside
# cloud_macro_microphysics; owner_class is always an existing Python class.
schema_version: 1
kernels:
  # ---- macrophysics (macrop_driver_tend subtree) --------------------------
  macrop_driver::macrop_driver_tend:
    category: control
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: the Macrophysics walk itself; installed as a class, not replaced through the registry
  cldwat2m_macro::mmacro_pcond:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: Park macrophysics condensation core (cldwat2m_macro.F90)
  cldwat2m_macro::instratus_condensate:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: in-stratus condensate solver called from mmacro_pcond
  cldwat2m_macro::instratus_core:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: inner iteration of the in-stratus condensate solver
  cldwat2m_macro::positive_moisture:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: positivity enforcement that rewrites q and t
  cldfrc2m::aist_single:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: ice stratus fraction, single point (cldfrc2m.F90)
  cldfrc2m::aist_vector:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: ice stratus fraction over a chunk
  cldfrc2m::astg_pdf:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: liquid stratus fraction from the Gauss PDF closure
  cldfrc2m::astg_pdf_single:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: liquid stratus fraction, single point
  cloud_fraction::cldfrc:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: diagnostic cloud fraction scheme called by the macrophysics driver
  cloud_fraction::cldfrc_fice:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: ice/liquid phase partition of cloud water (validated hook)
  cloud_fraction::relhum_min:
    category: replaceable_numeric
    subsystem: macrophysics
    owner_class: freecam.physics.macrophysics.Macrophysics
    basis: minimum relative-humidity thresholds entering the cloud fraction
  # ---- microphysics (micro_mg_cam_tend / micro_mg_tend subtree) -----------
  microp_driver::microp_driver_tend:
    category: control
    subsystem: microphysics
    owner_class: freecam.physics.microphysics.Microphysics
    basis: thin dispatch to micro_mg_cam_tend; the Microphysics walk owns it
