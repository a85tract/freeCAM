# Inputs and reviewable rules for the kernel-API closure record
# (validation/pi_cam_kernel_api_closure.json, generated by
# tools/build_pi_cam_kernel_api_closure.py).
#
# Syntax facts come from fparser over the preprocessed pinned source.  This
# file supplies what syntax cannot: which directories the build compiles and
# in what order, the configuration's macros, where the step starts, which
# namelist selectors and build options decide branches, and how a reachable
# procedure is categorised.  Every rule is deterministic and reviewed; the
# record names anything the rules leave undecided.
schema_version: 1

# The reference case's Buildconf/camconf/Filepath, minus SourceMods (empty
# for the reference case) and the stub unit-driver directory; then the share
# library directories the CAM build links.  Order is precedence: the first
# directory holding a basename wins, exactly as the build's search path does.
source_directories:
  - components/cam/src/chemistry/pp_trop_mam3
  - components/cam/src/chemistry/modal_aero
  - components/cam/src/chemistry/aerosol
  - components/cam/src/chemistry/mozart
  - components/cam/src/chemistry/utils
  - components/cam/src/physics/rrtmg
  - components/cam/src/physics/rrtmg/ext/rrtmg_mcica
  - components/cam/src/physics/rrtmg/ext/rrtmg_lw
  - components/cam/src/physics/rrtmg/ext/rrtmg_sw
  - components/cam/src/physics/cam
  - components/cam/src/dynamics/se
  - components/cam/src/dynamics/se/share
  - components/cam/src/cpl
  - components/cam/src/control
  - components/cam/src/utils
  - cime/src/share/util
  - cime/src/share/timing
  - cime/src/share/esmf_wrf_timemgr
  - cime/src/drivers/mct/shr

# Templates genf90 expands during the build; the expanded file replaces the
# template's basename at the template directory's precedence.
templates:
  - components/cam/src/physics/cam/physics_buffer.F90.in
  - components/cam/src/physics/cam/subcol_utils.F90.in
  - components/cam/src/utils/buffer.F90.in
  - cime/src/share/util/shr_frz_mod.F90.in
  - cime/src/share/util/shr_infnan_mod.F90.in
  - cime/src/share/util/shr_assert_mod.F90.in
genf90: cime/src/externals/genf90/genf90.pl

# CESM_cppdefs of the reference case plus the machine macros the compile
# command carries; verified against the image manifest when it is present.
macros:
  - CAM
  - CESMCOUPLED
  - CNL
  - CO2A
  - CPRINTEL
  - FORTRANUNDERSCORE
  - HAVE_F2003_PTR_BND_REMAP
  - HAVE_MPI
  - HAVE_SLASHPROC
  - LINUX
  - MCT_INTERFACE
  - MODAL_AERO
  - MODAL_AERO_3MODE
  - NDEBUG
  - PIO1
  - SPMD
  - _MPI
  - _PNETCDF
  - _PRIM
  - _WK_GRAD
  - PCOLS=16
  - PLEV=30
  - PCNST=57
  - N_RAD_CNST=30
  - PSUBCOLS=1
  - PLON=13826
  - PLAT=1
  - NP=4
  - NC=4
  - PTRM=1
  - PTRN=1
  - PTRK=1
  - USE_CONTIGUOUS=

# The physics step: phys_run1 runs tphysbc and the per-step preparation,
# phys_run2 runs tphysac.  Initialization is inventoried separately because
# it produces the hidden state the kernels read.
step_roots:
  - physpkg::phys_run1
  - physpkg::phys_run2
init_roots:
  - physpkg::phys_init

# Namelist variables whose values decide branches in the physics step.  The
# generator reads them from the reference run's atm_in and records the values.
selectors:
  - deep_scheme
  - shallow_scheme
  - macrop_scheme
  - microp_scheme
  - eddy_scheme
  - radiation_scheme
  - do_clubb_sgs
  - do_tms
  - use_gw_oro
  - use_gw_front
  - use_gw_front_igw
  - use_gw_convect_dp
  - use_gw_convect_sh
  - use_subcol_microp
  - microp_uniform
  - micro_mg_version
  - micro_mg_sub_version
  - micro_do_icesupersat
  - cld_macmic_num_steps
  - history_amwg
  - history_aerosol
  - history_budget
  - history_eddy
  - history_vdiag
  - history_waccm
  - history_waccmx
  - history_clubb
  - history_carma
  - history_chemistry
  - history_aero_optics
  - carma_model
  - srf_flux_avg
  - xactive_prates
  - dust_emis_fact
  - wisotope
  - cldfrc_ice
  - icecldoptics
  - liqcldoptics
  - solar_htng_spctrl_scl
  - micro_mg_precip_frac_method
  - wtrc_add_stprecip
  - wtrc_add_cvprecip
  - wtrc_check_total_h2o
  - nucleate_ice_subgrid

# Build-time options from the reference case's config_cache.xml.
build_options:
  - phys
  - chem
  - dyn
  - microphys
  - macrophys
  - rad
  - pbl
  - clubb_sgs
  - carma
  - waccm_phys
  - waccmx
  - offline_dyn
  - unicon
  - cosp
  - age_of_air_trcs
  - co2_cycle
  - water_tracer
  - nlev
  - pcols
  - psubcols

# Fortran functions that report a build option: cam_physpkg_is('cam5') is
# true when the phys option is cam5.
option_functions:
  cam_physpkg_is: phys
  cam_chempkg_is: chem

# Module variables whose value follows from the build options above and that
# guard branches in the step.  Each is justified by the pinned source.
constants:
  # carma_flags_mod: carma_flag is .true. only when carma_model /= 'none'.
  carma_flag: false
  # rad_constituents: clim_modal_aero is .true. when the climate list carries
  # modal aerosols, which trop_mam3 does.
  clim_modal_aero: true
  # phys_control: waccmx_is(...) is never true without the waccmx build option.
  waccmx: false
  # cam_control_mod: compset F1850C5 is neither adiabatic, ideal-physics nor
  # aqua-planet (the flags are set from the case's simple-physics options).
  adiabatic: false
  ideal_phys: false
  aqua_planet: false
  # cloud_diagnostics / cldwat: derived from macrop_scheme='park' and
  # microp_scheme='MG' at init.
  rk_clouds: false
  mg_clouds: true
  mg_microphys: true
  # water_tracers: trace_water is .true. when the water_tracer build option
  # names isotopes (h2o_h216o_hdo_h218o).
  trace_water: true
  # physics/cam/iondrag.F90 (the stub compiled without waccm_phys) sets
  # do_waccm_ions = .false.
  do_waccm_ions: false
  # mo_aurora: has_ions follows the presence of ion species (e, Op, O2p, Np,
  # N2p, NOp) in the mechanism; trop_mam3 has none.
  has_ions: false
  # runtime_opts: moist_physics = (.not. adiabatic) .and. (.not. ideal_phys).
  moist_physics: true
  # rad_constituents: oldcldoptics defaults to .false. and atm_in leaves it.
  oldcldoptics: false
  # phys_control: use_hetfrz_classnuc defaults to .false. and atm_in leaves it.
  use_hetfrz_classnuc: false

# Implicit-interface externals that belong to linked libraries, not to CAM.
library_names:
  - '^mpi_'
  - '^nf_'
  - '^nf90_'
  - '^pio_'
  - '^esmf_'
  - '^gptl'
  - '^omp_'
  - '^abort$'
  - '^shr_reprosumx86_'

# Plan actions whose Fortran content is not a procedure of the same name and
# not a tphysbc/tphysac stage block.  cam_run1.prepare runs the per-step
# preparation before tphysbc (physpkg::phys_run1 -> phys_timestep_init).
action_procedures:
  cam_run1.prepare:
    - physpkg::phys_timestep_init

# Categories, first match wins.  Anything not matched is a numeric_kernel:
# the closure's default is to open a procedure, not to hide it.
default_category: numeric_kernel
categories:
  - id: step-drivers
    category: process_control
    match: {qualified_regex: '^physpkg::(phys_run1|phys_run2|tphysbc|tphysac|phys_timestep_init)$'}
    note: the step's own control flow
  - id: share-services
    category: internal_service
    match: {source_regex: '^cime/src/(share/(util|timing|esmf_wrf_timemgr)|drivers)/'}
    note: CESM share utilities (logging, timing, MPI wrappers, time manager); not CAM physics
  - id: dynamics-and-coupler
    category: out_of_scope
    match: {source_regex: '^components/cam/src/(dynamics|cpl)/'}
    note: dynamical core and coupler interface, outside the physics scope
  - id: host-services
    category: internal_service
    match:
      module_regex: '^(cam_history|cam_history_support|cam_history_buffers|cam_abortutils|cam_logfile|cam_pio_utils|cam_grid_support|cam_map_utils|cam_instance|physics_buffer|buffer|subcol_utils|subcol|subcol_tstcp|spmd_utils|mpishorthand|wrap_mpi|wrap_nf|perf_mod|time_manager|phys_grid|ppgrid|pmgrid|error_messages|units|filenames|string_utils|namelist_utils|ioFileMod|cam_control_mod|phys_control|constituents|rad_constituents|physconst|hycoef|ref_pres|scamMod|infnan|shr_infnan_mod|cam_diagnostics_buffer|pio|cam_restart|restart_physics|restart_dynamics|ncdio_atm|dycore|dyn_grid|interp_mod|comsrf|camsrfexch|physics_types|check_energy_gmean|cmparray_mod|phys_debug|phys_debug_util)$'
    note: infrastructure the step calls -- history buffers, pbuf access, sub-column bookkeeping, column packing, communication, grids, clocks, constants, type allocators
  - id: forcing-data-readers
    category: internal_service
    match:
      module_regex: '^(tracer_data|boundarydata|prescribed_[a-z_]+|aerodep_flx|chlorine_loading_data|solar_data|mo_solar_parms|solar_parms|mo_flbc|ghg_data|chem_surfvals|spedata|cam3_aero_data|cam3_ozone_data|aircraft_emit|mo_extfrc|mo_srf_emissions|linoz_data|srf_field_check|input_data_utils)$'
    note: time-interpolated forcing datasets read from files; the file operation and its interpolation stay a service, the numerics that consume the fields are in scope
  - id: source-in-service-file
    category: internal_service
    match: {source_regex: '/(subcol|subcol_utils|subcol_tstcp|wrap_mpi|wrap_nf|cmparray_mod)\.F90$'}
    note: external procedures living in service files
  - id: field-io-by-name
    category: internal_service
    match: {name_regex: '^(outfld|addfld|add_default|hist_fld_active|hist_fld_col_active|pbuf_|t_startf|t_stopf|endrun|get_nstep|get_curr_date|get_curr_calday|is_first_step|is_first_restart_step|is_last_step|get_step_size|get_ncols_p|get_lat_all_p|get_lon_all_p|get_rlat_all_p|get_rlon_all_p|get_gcol_all_p|masterproc)'}
    note: field output, buffer access, timing and clock queries by their conventional names
