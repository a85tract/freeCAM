schema_version: 1

# CCPP metadata describes arguments and lifecycle entrypoints, but it cannot
# express host policy such as "refresh module parameters before every run" or
# a model-specific vertical-index convention.  Keep those small exceptions
# here so every scheme descriptor can still be regenerated under
# devices/generated/.
schemes:
  kessler:
    state_policy: reinitialize_each_run
    initialize_entrypoint: initialize
    bindings:
      vertical_index_at_surface_adjacent_layer:
        source: dimension
        name: pver
      vertical_index_at_top_adjacent_layer:
        source: literal
        value: 1

  kessler_update:
    state_policy: reinitialize_each_run
    initialize_entrypoint: initialize

  musica_ccpp:
    providers:
      ccpp_const_utils: native/devices/support/ccpp_const_utils.F90
      musica_ccpp_namelist: native/devices/support/musica_ccpp_namelist.F90
    host_entrypoints:
      register:
        kind: musica_constituent_registry
        process: musica_ccpp:register
        configure_symbol: pycam_musica_configure_v1
        register_symbol: pycam_musica_register_v1
        metadata_symbol: pycam_musica_metadata_v1
        release_symbol: pycam_musica_release_v1
        standard_name: ccpp_constituent_properties
        fortran_type: ccpp_constituent_prop_ptr_t
        configuration_standard_names:
        - micm_solver_type
        - filename_of_micm_configuration
        - filename_of_tuvx_configuration
        - filename_of_tuvx_micm_mapping_configuration
    extra_sources:
    - build/dependencies/ccpp-framework-musica/src/ccpp_hashable.F90
    - build/dependencies/ccpp-framework-musica/src/ccpp_hash_table.F90
    - build/dependencies/ccpp-framework-musica/src/ccpp_constituent_prop_mod.F90
    - native/devices/support/musica_constituent_registry.F90
    external_modules:
    - musica_micm
    - musica_state
    - musica_tuvx
    - musica_tuvx_grid
    - musica_tuvx_profile
    - musica_tuvx_radiator
    - musica_util
    external_include_dirs:
    - build/dependencies/musica-install/include/musica/fortran
    external_libraries:
    - build/dependencies/musica-install/lib64/libmusica-fortran.a
    - build/dependencies/musica-install/lib64/libmusica.a
    - build/dependencies/musica-install/lib64/libmechanism_configuration.a
    - build/dependencies/musica-install/lib64/libyaml-cpp.a
    - stdc++
    # MUSICA's TUV-x archive references the serial NetCDF C/Fortran ABI.
    # Pin the non-MPI Derecho build so the resulting device does not inherit
    # the case environment's Cray-MPICH NetCDF dependency.
    - /glade/u/apps/derecho/23.09/spack/opt/spack/netcdf/4.9.2/gcc/12.2.0/gjc6/lib/libnetcdff.so
    - /glade/u/apps/derecho/23.09/spack/opt/spack/netcdf/4.9.2/gcc/12.2.0/gjc6/lib/libnetcdf.so
    extra_exports:
    - pycam_musica_configure_v1
    - pycam_musica_register_v1
    - pycam_musica_metadata_v1
    - pycam_musica_release_v1
    preprocessor_definitions:
    - PYCAM_CCPP_DIAG_NAME
    allowed_elf_dependencies:
    - netcdf
