<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" role="img" aria-label="A Jupyter notebook submits one PBS job of 512 MPI ranks on Derecho and then sends it commands; rank 0 broadcasts each command, every rank runs freeCAM's Python driver over its own NumPy state, and the original iCESM Fortran computes every number.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4752"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1158" height="598" rx="14" fill="#ffffff" stroke="#d8dee3"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2933">

    <!-- the notebook -->
    <rect x="28" y="72" width="300" height="300" rx="10" fill="#f6f8fa" stroke="#9aa7b1"/>
    <rect x="28" y="72" width="300" height="54" rx="10" fill="#e6eef6" stroke="#9aa7b1"/>
    <rect x="29" y="112" width="298" height="14" fill="#e6eef6"/>
    <text x="48" y="98" font-size="16" font-weight="700">Jupyter notebook</text>
    <text x="48" y="117" font-size="12" fill="#5b6670">your Python session, on a login node</text>
    <g font-family="Menlo, Consolas, monospace" font-size="12.5">
      <text x="48" y="156">import freecam as fc</text>
      <text x="48" y="180">d = fc.Driver(case="PI-atm")</text>
      <text x="48" y="204">d.initialize()  <tspan fill="#5b6670"># the job starts</tspan></text>
      <text x="48" y="228">d.cam.state.T.stats()</text>
      <text x="48" y="252">d.run(nsteps=48)</text>
      <text x="48" y="276">rad = d.processes["radiation"]</text>
      <text x="48" y="300">rad.process = my_network</text>
      <text x="48" y="324">d.run(nsteps=48)</text>
    </g>
    <text x="48" y="356" font-size="12" fill="#5b6670">Every line acts on the running model.</text>

    <!-- arrows between the notebook and the job -->
    <line x1="328" y1="104" x2="450" y2="104" stroke="#3b4752" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="389" y="92" font-size="12" text-anchor="middle" font-weight="700">qsub, once</text>
    <text x="389" y="124" font-size="11" text-anchor="middle" fill="#5b6670">4 nodes, 512 ranks</text>
    <line x1="328" y1="214" x2="474" y2="214" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="401" y="204" font-size="12" text-anchor="middle">each command</text>
    <line x1="474" y1="250" x2="328" y2="250" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="401" y="270" font-size="12" text-anchor="middle">stats, plots,</text>
    <text x="401" y="286" font-size="12" text-anchor="middle">traces back</text>

    <!-- the job -->
    <rect x="452" y="40" width="684" height="472" rx="12" fill="none" stroke="#7d8a95" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="474" y="66" font-size="16" font-weight="700">Derecho compute nodes</text>
    <text x="680" y="66" font-size="12" fill="#5b6670">one MPI job, kept alive between commands</text>

    <!-- rank 0 -->
    <rect x="474" y="86" width="410" height="404" rx="10" fill="#fbfcfd" stroke="#9aa7b1"/>
    <text x="494" y="112" font-size="14" font-weight="700">MPI rank 0 <tspan font-weight="400" fill="#5b6670">(each of the 512 is the same)</tspan></text>

    <g font-size="12">
      <rect x="494" y="126" width="370" height="54" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="510" y="149" font-size="14" font-weight="700" fill="#24496c">Session worker</text>
      <text x="510" y="168" fill="#3b4752">receives the command, runs it on this rank</text>

      <rect x="494" y="190" width="370" height="54" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="510" y="213" font-size="14" font-weight="700" fill="#24496c">Driver</text>
      <text x="510" y="232" fill="#3b4752">the step as an ordered plan, the clock, a trace</text>

      <rect x="494" y="254" width="370" height="54" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="510" y="277" font-size="14" font-weight="700" fill="#24496c">StatePool</text>
      <text x="510" y="296" fill="#3b4752">the model state as NumPy arrays; Fortran points into them</text>

      <rect x="494" y="342" width="370" height="54" rx="8" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="510" y="365" font-size="14" font-weight="700" fill="#6b450c">CAM atmosphere</text>
      <text x="510" y="384" fill="#3b4752">original iCESM Fortran, called through adapters</text>

      <rect x="494" y="406" width="370" height="54" rx="8" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="510" y="429" font-size="14" font-weight="700" fill="#6b450c">Surface models and coupler</text>
      <text x="510" y="448" fill="#3b4752">land, sea ice, ocean, rivers: original CESM, live</text>
    </g>
    <line x1="679" y1="308" x2="679" y2="340" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="692" y="322" font-size="12" font-weight="700">Python decides what runs,</text>
    <text x="692" y="337" font-size="12" font-weight="700">Fortran computes it</text>

    <!-- the other ranks -->
    <rect x="964" y="150" width="150" height="250" rx="10" fill="#fbfcfd" stroke="#b6c0c8"/>
    <rect x="952" y="138" width="150" height="250" rx="10" fill="#fbfcfd" stroke="#b6c0c8"/>
    <rect x="940" y="126" width="150" height="250" rx="10" fill="#fbfcfd" stroke="#9aa7b1"/>
    <text x="1015" y="152" font-size="13" font-weight="700" text-anchor="middle">ranks 1 … 511</text>
    <rect x="956" y="166" width="118" height="22" rx="5" fill="#e6eef6" stroke="#2f5d8a"/>
    <rect x="956" y="194" width="118" height="22" rx="5" fill="#e6eef6" stroke="#2f5d8a"/>
    <rect x="956" y="222" width="118" height="22" rx="5" fill="#e6eef6" stroke="#2f5d8a"/>
    <rect x="956" y="260" width="118" height="22" rx="5" fill="#f6ead6" stroke="#8a5a12"/>
    <rect x="956" y="288" width="118" height="22" rx="5" fill="#f6ead6" stroke="#8a5a12"/>
    <text x="1015" y="336" font-size="12" text-anchor="middle" fill="#5b6670">each with its own</text>
    <text x="1015" y="352" font-size="12" text-anchor="middle" fill="#5b6670">part of the globe</text>

    <line x1="884" y1="200" x2="938" y2="200" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="911" y="190" font-size="11" text-anchor="middle">MPI</text>
    <line x1="938" y1="232" x2="884" y2="232" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="911" y="250" font-size="11" text-anchor="middle">results</text>

    <text x="474" y="538" font-size="13" font-weight="700">The fields never leave their rank.</text>
    <text x="474" y="558" font-size="13" fill="#3b4752">The notebook gets only what it asks for: a statistic, a column, a plot.</text>

    <!-- legend -->
    <rect x="28" y="530" width="16" height="16" rx="3" fill="#e6eef6" stroke="#2f5d8a"/>
    <text x="52" y="543" font-size="12">freeCAM (Python): control and state</text>
    <rect x="28" y="556" width="16" height="16" rx="3" fill="#f6ead6" stroke="#8a5a12"/>
    <text x="52" y="569" font-size="12">original Fortran: every number</text>
  </g>
</svg>
