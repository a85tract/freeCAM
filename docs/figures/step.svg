<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 954" role="img" aria-label="One model simulation step of freeCAM as an ordered list of processes: surface fields from the coupler, the physics after coupling, the SE dynamical core, the output, the physics before coupling, and surface fields to the coupler, after which Python runs the list again. Any process can be switched off, moved, run on its own, or replaced by a Python function; radiation and cloud macro/microphysics have whole-process slots; eleven processes have kernel slots; with nothing replaced the step is bit-for-bit identical to the original CESM.">
