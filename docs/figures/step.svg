<text x="492" y="630" font-size="13" font-weight="700" fill="#4b3577">Whole-process slots</text>
<text x="492" y="652" font-size="12">Radiation and cloud macro/microphysics can each</text>
<text x="492" y="668" font-size="12">be filled whole by a trained network or a replay.</text>
<rect x="476" y="705" width="350" height="92" rx="10" fill="#efe9f7" stroke="#6b4fa0"/>
<text x="492" y="730" font-size="13" font-weight="700" fill="#4b3577">Kernel slots</text>
<text x="492" y="752" font-size="12">In 11 processes, each kernel can be filled by a</text>
<text x="492" y="768" font-size="12">Python function or a trained network. The network</text>
<text x="492" y="784" font-size="12">for compute_uwshcu_inv runs on CPU or GPU.</text>
<rect x="476" y="805" width="350" height="92" rx="10" fill="#dcefec" stroke="#0d7a72"/>
<text x="492" y="830" font-size="13" font-weight="700" fill="#0a5f59">Nothing replaced</text>
<text x="492" y="852" font-size="12">The step is bit-for-bit identical to that of the</text>
<text x="492" y="868" font-size="12">original CESM.</text>
