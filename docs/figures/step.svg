<text x="40" y="938" fill="#3b4752">after each 30-minute step, Python runs the list again</text>
<rect x="476" y="505" width="350" height="92" rx="10" fill="#e6eef6" stroke="#2f5d8a"/>
<text x="492" y="530" font-size="13" font-weight="700" fill="#24496c">Any process</text>
<text x="492" y="552" font-size="12">Every process in the list, the dynamical core</text>
<text x="492" y="568" font-size="12">included, can be switched off, moved, run on its</text>
<text x="492" y="584" font-size="12">own, or replaced by a Python function.</text>
