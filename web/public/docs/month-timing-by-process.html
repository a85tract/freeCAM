<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<style>
/* layout: one reading column; summary chart, then tables from coarse to fine, then every raw timer */
:root {
  --page: #f6f6f3; --surface: #fcfcfb; --ink: #121212; --ink-2: #4f4e4a; --muted: #85837d;
  --grid: #e3e2db; --axis: #c3c2b7; --ring: rgba(18,18,18,0.10); --tip: #ffffff; --hl: rgba(42,120,214,0.08);
  --up: #b4402f; --down: #1f7a4d;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
  --sans: "IBM Plex Sans", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0f0f0e; --surface: #1a1a19; --ink: #f4f4f1; --ink-2: #c3c2b7; --muted: #8d8b84;
    --grid: #2c2c2a; --axis: #3d3d3a; --ring: rgba(255,255,255,0.10); --tip: #242423; --hl: rgba(57,135,229,0.14);
    --up: #e8806f; --down: #5cc493;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0f0f0e; --surface: #1a1a19; --ink: #f4f4f1; --ink-2: #c3c2b7; --muted: #8d8b84;
  --grid: #2c2c2a; --axis: #3d3d3a; --ring: rgba(255,255,255,0.10); --tip: #242423; --hl: rgba(57,135,229,0.14);
  --up: #e8806f; --down: #5cc493;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
}
body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 30px; }
header { display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
h1 { font-size: 26px; line-height: 1.25; margin: 0; font-weight: 600; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 72ch; }
.lede b { color: var(--ink); font-weight: 600; }
.legs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 680px) { .legs { grid-template-columns: 1fr; } }
.leg { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.leg .k { font-size: 12.5px; color: var(--ink-2); }
.leg .v { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.leg .v small { font-size: 13px; color: var(--muted); margin-left: 6px; }
.leg .n { font-size: 12.5px; color: var(--muted); }
section { display: grid; gap: 10px; min-width: 0; }
section > h2 { font-size: 18px; margin: 0; font-weight: 600; }
section > p, .note { margin: 0; color: var(--ink-2); max-width: 76ch; font-size: 14px; }
figure { margin: 0; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px 16px 10px; display: grid; gap: 8px; position: relative; min-width: 0; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
svg { width: 100%; height: auto; display: block; }
svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
svg .lab { fill: var(--ink-2); font-family: var(--sans); font-size: 13px; }
svg .seglab { fill: #fff; font-size: 10.5px; pointer-events: none; }
svg rect.seg { stroke: var(--surface); stroke-width: 2; cursor: default; }
svg rect.seg:hover { opacity: 0.85; }
.tip { position: absolute; pointer-events: none; background: var(--tip); color: var(--ink); border: 1px solid var(--ring);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 4px 16px rgba(0,0,0,0.14); min-width: 160px; z-index: 5; }
.tip b { font-weight: 600; } .tip .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; }
.tablebox.tall { max-height: 640px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 11px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
th { font-weight: 500; color: var(--ink-2); font-size: 12px; vertical-align: bottom; background: var(--surface); position: sticky; top: 0; z-index: 1; }
th.l, td.l { text-align: left; }
td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
td.t { font-family: var(--sans); }
td.code { color: var(--muted); font-size: 12px; }
tr.group td { font-family: var(--sans); font-weight: 600; color: var(--ink); background: var(--hl); }
tr.group td .code { font-family: var(--mono); font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12px; }
tr.sum td { font-weight: 600; border-top: 1px solid var(--axis); }
tr:last-child td { border-bottom: 0; }
.up { color: var(--up); } .down { color: var(--down); } .dim { color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }
.controls label { display: inline-flex; gap: 6px; align-items: center; }
select, input[type="search"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 4px 8px; }
input[type="search"] { min-width: 0; width: 220px; max-width: 100%; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button { font: inherit; font-size: 13px; color: var(--ink-2); background: transparent; border: 1px solid var(--ring); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--axis); font-weight: 500; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }
.notes { display: grid; gap: 8px; color: var(--ink-2); max-width: 78ch; font-size: 14px; }
.notes p { margin: 0; } .notes b { color: var(--ink); font-weight: 600; }
code { font-family: var(--mono); font-size: 12.5px; }
tr.small td { color: var(--muted); }
.wrap { max-width: 900px; }
.back { font-size: 13px; color: var(--muted); text-decoration: none; justify-self: start; }
.back:hover { color: var(--ink-2); text-decoration: underline; }
</style>
</head>

<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const f = (x) => (Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(2));
  const sgn = (x) => (x > 0.005 ? "+" : x < -0.005 ? "−" : "±") + f(Math.abs(x));
  const cls = (x) => (x > 0.3 ? "up" : x < -0.3 ? "down" : "dim");
  const L = D.loop;
  $("lede").textContent = `Mean seconds per rank. C is freeCAM with nothing replaced, bit-for-bit with the original Fortran; H has shallow convection replaced by a GPU model. Totals: original Fortran ${L.A.toFixed(1)} s, C ${L.C.toFixed(1)} s, H ${L.H.toFixed(1)} s.`;
  const PH = { cam_run2: "Physics after surface coupling", cam_run3: "Dynamics", cam_run4: "Output", clock: "Clock", cam_run1: "Physics before surface coupling", coupling: "Exchange with the coupler (includes the surface components and waiting)" };
  const H = Object.fromEntries(D.H.map((a) => [a.op, a]));
  let out = `<thead><tr><th class="l">Process</th><th class="l">CAM routine</th><th>C (s)</th><th>H (s)</th><th>H − C</th><th>% of C</th></tr></thead><tbody>`;
  let last = null, sc = 0, sh = 0;
  D.C.forEach((a) => {
    if (a.phase !== last) { last = a.phase; out += `<tr class="group"><td class="l" colspan="6">${PH[a.phase]}</td></tr>`; }
    const h = H[a.op]; sc += a.mean; sh += h.mean;
    const small = a.mean < 0.5 && h.mean < 0.5 ? ' class="small"' : "";
    out += `<tr${small}><td class="l t">${esc(a.zh)}</td><td class="l code">${esc(a.op)}</td><td>${f(a.mean)}</td><td>${f(h.mean)}</td><td class="${cls(h.mean - a.mean)}">${sgn(h.mean - a.mean)}</td><td>${(100 * a.mean / D.step.C).toFixed(1)}%</td></tr>`;
  });
  out += `<tr class="sum"><td class="l t">Other (between actions)</td><td class="l code"></td><td>${f(D.step.C - sc)}</td><td>${f(D.step.H - sh)}</td><td class="dim">${sgn((D.step.H - sh) - (D.step.C - sc))}</td><td></td></tr>`;
  out += `<tr class="sum"><td class="l t">Total</td><td class="l code">FREECAM:STEP</td><td>${f(D.step.C)}</td><td>${f(D.step.H)}</td><td class="up">${sgn(D.step.H - D.step.C)}</td><td>100%</td></tr></tbody>`;
  $("actions").innerHTML = out;
})();
</script>
