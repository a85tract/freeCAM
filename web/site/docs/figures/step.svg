<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 440" role="img" aria-label="One model step is an ordered list of processes that Python runs one after another; a process can be switched off, moved or joined by Python physics, a whole process such as radiation can be answered by a network, and one kernel inside a process, such as shallow convection's compute_uwshcu_inv, can be answered by a neural network on CPU or GPU. With nothing replaced the run is bit-for-bit the original.">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4752"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1158" height="438" rx="14" fill="#ffffff" stroke="#d8dee3"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2933" font-size="12">

    <!-- the six phases of one step, in the order the plan runs them -->
    <g>
      <rect x="15" y="34" width="130" height="196" rx="10" fill="#f6f8fa" stroke="#cfd7dd"/>
      <text x="80" y="56" font-size="13" font-weight="700" text-anchor="middle">from the coupler</text>
      <rect x="27" y="70" width="106" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="80" y="90" text-anchor="middle">surface fields in</text>

      <rect x="179" y="34" width="190" height="196" rx="10" fill="#f6f8fa" stroke="#cfd7dd"/>
      <text x="274" y="56" font-size="13" font-weight="700" text-anchor="middle">physics after coupling</text>
      <rect x="191" y="70" width="166" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="274" y="90" text-anchor="middle">chemistry and aerosols</text>
      <rect x="191" y="108" width="166" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="274" y="128" text-anchor="middle">vertical diffusion</text>
      <rect x="191" y="146" width="166" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="274" y="166" text-anchor="middle">dry deposition</text>
      <rect x="191" y="184" width="166" height="30" rx="6" fill="#f6ead6" stroke="#2f5d8a" stroke-width="2"/>
      <text x="274" y="204" text-anchor="middle">gravity-wave drag</text>

      <rect x="403" y="34" width="150" height="196" rx="10" fill="#f6f8fa" stroke="#cfd7dd"/>
      <text x="478" y="56" font-size="13" font-weight="700" text-anchor="middle">dynamics</text>
      <rect x="415" y="70" width="126" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="478" y="90" text-anchor="middle">SE dynamical core</text>

      <rect x="587" y="34" width="120" height="196" rx="10" fill="#f6f8fa" stroke="#cfd7dd"/>
      <text x="647" y="56" font-size="13" font-weight="700" text-anchor="middle">output</text>
      <rect x="599" y="70" width="96" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="647" y="90" text-anchor="middle">history</text>
      <rect x="599" y="108" width="96" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="647" y="128" text-anchor="middle">restart</text>

      <rect x="741" y="34" width="200" height="196" rx="10" fill="#f6f8fa" stroke="#cfd7dd"/>
      <text x="841" y="56" font-size="13" font-weight="700" text-anchor="middle">physics before coupling</text>
      <rect x="753" y="70" width="176" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="841" y="90" text-anchor="middle">deep convection (ZM)</text>
      <rect x="753" y="108" width="176" height="30" rx="6" fill="#efe9f7" stroke="#6b4fa0" stroke-width="2"/>
      <text x="841" y="128" text-anchor="middle" font-weight="700" fill="#4b3577">shallow convection (UW)</text>
      <rect x="753" y="146" width="176" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="841" y="166" text-anchor="middle">cloud macro/microphysics</text>
      <rect x="753" y="184" width="176" height="30" rx="6" fill="#efe9f7" stroke="#6b4fa0" stroke-width="2"/>
      <text x="841" y="204" text-anchor="middle" font-weight="700" fill="#4b3577">radiation (RRTMG)</text>

      <rect x="975" y="34" width="170" height="196" rx="10" fill="#f6f8fa" stroke="#cfd7dd"/>
      <text x="1060" y="56" font-size="13" font-weight="700" text-anchor="middle">to the coupler</text>
      <rect x="987" y="70" width="146" height="30" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="1060" y="90" text-anchor="middle">surface fields out</text>
      <rect x="987" y="108" width="146" height="44" rx="6" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="1060" y="126" text-anchor="middle">land, sea ice, ocean,</text>
      <text x="1060" y="142" text-anchor="middle">rivers step</text>
    </g>

    <!-- the order -->
    <g stroke="#3b4752" stroke-width="1.6">
      <line x1="147" y1="132" x2="177" y2="132" marker-end="url(#b)"/>
      <line x1="371" y1="132" x2="401" y2="132" marker-end="url(#b)"/>
      <line x1="555" y1="132" x2="585" y2="132" marker-end="url(#b)"/>
      <line x1="709" y1="132" x2="739" y2="132" marker-end="url(#b)"/>
      <line x1="943" y1="80" x2="973" y2="80" marker-end="url(#b)"/>
      <path d="M1060 230 V256 H80 V232" fill="none" marker-end="url(#b)"/>
    </g>
    <text x="570" y="276" text-anchor="middle" fill="#3b4752">the next step: every 30 model minutes, Python runs the list again, one process at a time</text>

    <!-- what can change -->
    <line x1="274" y1="214" x2="274" y2="312" stroke="#2f5d8a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="179" y="312" width="300" height="112" rx="10" fill="#e6eef6" stroke="#2f5d8a"/>
    <text x="195" y="336" font-size="13" font-weight="700" fill="#24496c">Edit the list</text>
    <text x="195" y="356">switch a process off, move it, run it on its</text>
    <text x="195" y="373">own, or insert physics written in Python;</text>
    <text x="195" y="390">no rebuild of CAM</text>

    <line x1="841" y1="214" x2="841" y2="312" stroke="#6b4fa0" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="696" y="312" width="226" height="112" rx="10" fill="#efe9f7" stroke="#6b4fa0"/>
    <text x="712" y="336" font-size="13" font-weight="700" fill="#4b3577">Replace a whole process</text>
    <text x="712" y="356">a network or a replay answers</text>
    <text x="712" y="373">radiation's whole block; the rest</text>
    <text x="712" y="390">of the step is unchanged</text>

    <polyline points="931,123 958,123 958,312" fill="none" stroke="#6b4fa0" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="936" y="312" width="210" height="112" rx="10" fill="#efe9f7" stroke="#6b4fa0"/>
    <text x="952" y="336" font-size="13" font-weight="700" fill="#4b3577">Replace one kernel</text>
    <text x="952" y="356">compute_uwshcu_inv, inside</text>
    <text x="952" y="373">shallow convection, answered</text>
    <text x="952" y="390">by a neural network on the</text>
    <text x="952" y="407">CPU or the GPU</text>

    <rect x="15" y="312" width="150" height="112" rx="10" fill="#dcefec" stroke="#0d7a72"/>
    <text x="31" y="336" font-size="13" font-weight="700" fill="#0a5f59">Nothing replaced</text>
    <text x="31" y="356">bit-for-bit the</text>
    <text x="31" y="373">original iCESM, at</text>
    <text x="31" y="390">512 ranks</text>
  </g>
</svg>
