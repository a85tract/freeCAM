<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 774" role="img" aria-label="freeCAM's architecture by where it runs. On the user's machine or a login node: the user interface (a notebook or script, the Workflow Builder, and batch jobs). On the compute nodes of the NSF NCAR Derecho Supercomputer, in one persistent MPI job of 512 ranks: the Python control layer on every rank, which decides what runs, and the native layer, where generated adapters call the original CAM Fortran, which computes every number.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b4752"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="838" height="772" rx="14" fill="#ffffff" stroke="#d8dee3"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1f2933">

    <!-- where the user works -->
    <rect x="20" y="20" width="800" height="162" rx="12" fill="#fbfcfd" stroke="#7d8a95" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="40" y="47" font-size="15" font-weight="700">Your machine or a login node</text>
    <text x="800" y="47" font-size="12" fill="#5b6670" text-anchor="end">where you work</text>
    <text x="40" y="76" font-size="12" font-weight="700" fill="#5b6670">User interface</text>
    <g font-size="11.5" fill="#3b4752">
      <rect x="40" y="86" width="240" height="78" rx="8" fill="#ffffff" stroke="#9aa7b1"/>
      <text x="54" y="108" font-size="13" font-weight="700" fill="#1f2933">Notebook or script</text>
      <text x="54" y="127">Drives the model from Python code.</text>
      <rect x="300" y="86" width="240" height="78" rx="8" fill="#ffffff" stroke="#9aa7b1"/>
      <text x="314" y="108" font-size="13" font-weight="700" fill="#1f2933">Workflow Builder</text>
      <text x="314" y="127">Edits, checks, and runs the step</text>
      <text x="314" y="142">in a browser.</text>
      <rect x="560" y="86" width="240" height="78" rx="8" fill="#ffffff" stroke="#9aa7b1"/>
      <text x="574" y="108" font-size="13" font-weight="700" fill="#1f2933">Batch jobs</text>
      <text x="574" y="127">Run the model from a PBS</text>
      <text x="574" y="142">job script.</text>
    </g>

    <!-- between the two -->
    <line x1="300" y1="182" x2="300" y2="226" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="312" y="208" font-size="12">commands</text>
    <line x1="520" y1="226" x2="520" y2="182" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="532" y="208" font-size="12">results</text>

    <!-- the compute nodes -->
    <rect x="20" y="228" width="800" height="526" rx="12" fill="none" stroke="#7d8a95" stroke-width="1.4" stroke-dasharray="7 5"/>
    <text x="40" y="255" font-size="15" font-weight="700">Compute nodes, NSF NCAR Derecho Supercomputer</text>
    <text x="800" y="255" font-size="12" fill="#5b6670" text-anchor="end">one persistent MPI job of 512 ranks</text>

    <!-- Python control layer -->
    <rect x="40" y="270" width="760" height="276" rx="10" fill="#f7fafd" stroke="#2f5d8a" stroke-width="1.3"/>
    <text x="56" y="292" font-size="13" font-weight="700" fill="#24496c">Python control layer, on every MPI rank</text>
    <g font-size="11.5" fill="#3b4752">
      <rect x="56" y="304" width="232" height="80" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="70" y="325" font-size="13" font-weight="700" fill="#24496c">Driver</text>
      <text x="70" y="343">Runs the step as an ordered plan</text>
      <text x="70" y="358">of processes, keeping the clock</text>
      <text x="70" y="373">and a trace.</text>
      <rect x="304" y="304" width="232" height="80" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="318" y="325" font-size="13" font-weight="700" fill="#24496c">StatePool</text>
      <text x="318" y="343">Exposes the model state as NumPy</text>
      <text x="318" y="358">arrays that the Fortran points</text>
      <text x="318" y="373">into directly.</text>
      <rect x="552" y="304" width="232" height="80" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="566" y="325" font-size="13" font-weight="700" fill="#24496c">Parameters</text>
      <text x="566" y="343">Checks the namelist against the</text>
      <text x="566" y="358">source and tunes parameters</text>
      <text x="566" y="373">while the model runs.</text>

      <rect x="56" y="398" width="356" height="134" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="70" y="419" font-size="13" font-weight="700" fill="#24496c">Process classes</text>
      <text x="70" y="437">Wrap each of the 23 physics processes as a</text>
      <text x="70" y="452">Python class, with a slot for the whole</text>
      <text x="70" y="467">process or for one kernel inside it.</text>

      <rect x="428" y="398" width="356" height="62" rx="8" fill="#e6eef6" stroke="#2f5d8a"/>
      <text x="442" y="419" font-size="13" font-weight="700" fill="#24496c">Boundary</text>
      <text x="442" y="437">Couples CAM with the live surface models or</text>
      <text x="442" y="452">replays captured boundary data.</text>

      <line x1="412" y1="501" x2="426" y2="501" stroke="#3b4752" stroke-width="1.4" marker-end="url(#a)"/>
      <rect x="428" y="470" width="356" height="62" rx="8" fill="#efe8f5" stroke="#6b4c8a"/>
      <text x="442" y="491" font-size="13" font-weight="700" fill="#4b2f6b">Slot replacements</text>
      <text x="442" y="509">Fill a slot with a Python function, a plugin,</text>
      <text x="442" y="524">a replay, or a trained network.</text>
    </g>

    <!-- between the layers -->
    <line x1="250" y1="546" x2="250" y2="586" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="262" y="571" font-size="12">Python decides what runs</text>
    <line x1="560" y1="586" x2="560" y2="546" stroke="#3b4752" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="572" y="571" font-size="12">Fortran computes every number</text>

    <!-- native layer -->
    <rect x="40" y="588" width="760" height="148" rx="10" fill="#fdf9f2" stroke="#8a5a12" stroke-width="1.3"/>
    <text x="56" y="610" font-size="13" font-weight="700" fill="#6b450c">Native layer: the original CAM Fortran, its numerics unchanged</text>
    <g font-size="11.5" fill="#3b4752">
      <rect x="56" y="622" width="232" height="100" rx="8" fill="#ffffff" stroke="#8a5a12"/>
      <text x="70" y="643" font-size="13" font-weight="700" fill="#6b450c">Generated adapters</text>
      <text x="70" y="661">Convert pointers, shapes, scalars,</text>
      <text x="70" y="676">and communicators for</text>
      <text x="70" y="691">C-interoperable calls, with no</text>
      <text x="70" y="706">arithmetic of their own.</text>
      <line x1="288" y1="672" x2="302" y2="672" stroke="#3b4752" stroke-width="1.4" marker-end="url(#a)"/>
      <rect x="304" y="622" width="232" height="100" rx="8" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="318" y="643" font-size="13" font-weight="700" fill="#6b450c">CAM image</text>
      <text x="318" y="661">Runs the original CAM5 physics</text>
      <text x="318" y="676">and SE dynamics, pausing at</text>
      <text x="318" y="691">kernels for the slots.</text>
      <rect x="552" y="622" width="232" height="100" rx="8" fill="#f6ead6" stroke="#8a5a12"/>
      <text x="566" y="643" font-size="13" font-weight="700" fill="#6b450c">Surface and coupler library</text>
      <text x="566" y="661">Runs the live land, sea ice, ocean,</text>
      <text x="566" y="676">and river models together with</text>
      <text x="566" y="691">the CESM coupler.</text>
    </g>
  </g>
</svg>
