<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>freeCAM Implementation Progress</title>
    <script>
      // apply the shared theme preference before first paint
      try {
        var stored = localStorage.getItem("freecam-ui-theme");
        if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
