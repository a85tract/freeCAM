[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freecam"
version = "0.19.0"
description = "Python-owned CAM runtime with observable state and Fortran kernel adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11"
dependencies = [
  "cloudpickle>=3.1,<4",
  "fparser>=0.2.1,<0.3",
  "mpi4py>=4.0",
  "netCDF4>=1.7",
  "numpy>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=7.0",
  "matplotlib>=3.9",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "xarray>=2025.1",
]
test = ["pytest>=8.0", "httpx>=0.27"]
# The Workflow Builder's local service: a browser page editing the step and
# running it through a Driver.  Optional, so ``import freecam`` needs none of it.
ui = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "nbformat>=5.10",
]
# What a stage needs to run a trained model in its kernel slot.  Every rank
# of a model run loads its own copy, so this is runtime, not tooling: an
# undeclared torch is one `uv sync` away from failing 512 ranks at once,
# which is how job 7301722 died.
surrogate = ["torch>=2.4"]

[project.scripts]
freecam = "freecam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freecam"]
# The Workflow Builder's page and generator bundle are build products (see
# web/); they are ignored by git but shipped in the wheel when present.
artifacts = ["src/freecam/pi_cam/workflow_builder/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
