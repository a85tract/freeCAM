[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freecam"
version = "0.19.0"
description = "Python-owned CAM runtime with observable state and Fortran kernel adapters"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "cloudpickle>=3.1,<4",
  "fparser>=0.2.1,<0.3",
  "mpi4py>=4.0",
  "netCDF4>=1.7",
  "numpy>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=7.0",
  "matplotlib>=3.9",
]
test = ["pytest>=8.0"]

[project.scripts]
freecam = "freecam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freecam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
